<!-- example: variants | Variantes -->
<div class="demo-grid">
  <figure class="demo-cell"><span class="badge">Nuevo</span><figcaption>default</figcaption></figure>
  <figure class="demo-cell"><span class="badge" data-variant="secondary">Borrador</span><figcaption>secondary</figcaption></figure>
  <figure class="demo-cell"><span class="badge" data-variant="outline">Plan 2</span><figcaption>outline</figcaption></figure>
  <figure class="demo-cell"><span class="badge" data-variant="destructive">Vencida</span><figcaption>destructive</figcaption></figure>
  <figure class="demo-cell"><span class="badge" data-variant="success">Activa</span><figcaption>success</figcaption></figure>
  <figure class="demo-cell"><span class="badge" data-variant="warning">Por vencer</span><figcaption>warning</figcaption></figure>
  <figure class="demo-cell"><span class="badge" data-variant="info">En revisión</span><figcaption>info</figcaption></figure>
  <figure class="demo-cell"><span class="badge" data-variant="accent">Administrador</span><figcaption>accent</figcaption></figure>
</div>

<!-- example: status | Estado con punto -->
<div class="demo-grid">
  <figure class="demo-cell"><span class="badge" data-variant="success" data-dot>Activa</span><figcaption>success</figcaption></figure>
  <figure class="demo-cell"><span class="badge" data-variant="warning" data-dot>Invitada</span><figcaption>warning</figcaption></figure>
  <figure class="demo-cell"><span class="badge" data-variant="secondary" data-dot>Desactivada</span><figcaption>secondary</figcaption></figure>
  <figure class="demo-cell"><span class="badge" data-variant="destructive" data-dot>Bloqueada</span><figcaption>destructive</figcaption></figure>
  <figure class="demo-cell"><span class="badge" data-variant="info"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.5v.01"/></svg>Sin conexión</span><figcaption>con icono</figcaption></figure>
</div>
