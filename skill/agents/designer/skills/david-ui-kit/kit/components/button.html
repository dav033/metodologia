<!-- example: variants | Variantes -->
<div class="demo-grid">
  <figure class="demo-cell"><button class="button" type="button">Guardar cambios</button><figcaption>default</figcaption></figure>
  <figure class="demo-cell"><button class="button" data-variant="secondary" type="button">Exportar</button><figcaption>secondary</figcaption></figure>
  <figure class="demo-cell"><button class="button" data-variant="outline" type="button">Cancelar</button><figcaption>outline</figcaption></figure>
  <figure class="demo-cell"><button class="button" data-variant="ghost" type="button">Ver detalle</button><figcaption>ghost</figcaption></figure>
  <figure class="demo-cell"><button class="button" data-variant="destructive" type="button">Eliminar</button><figcaption>destructive</figcaption></figure>
  <figure class="demo-cell"><button class="button" data-variant="link" type="button">Ver historial</button><figcaption>link</figcaption></figure>
</div>

<!-- example: sizes | Tamaños e icono -->
<div class="demo-grid">
  <figure class="demo-cell"><button class="button" data-size="sm" type="button">Filtrar</button><figcaption>sm</figcaption></figure>
  <figure class="demo-cell"><button class="button" type="button">Filtrar</button><figcaption>default</figcaption></figure>
  <figure class="demo-cell"><button class="button" data-size="lg" type="button">Filtrar</button><figcaption>lg</figcaption></figure>
  <figure class="demo-cell"><button class="button" type="button"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Invitar persona</button><figcaption>con icono</figcaption></figure>
  <figure class="demo-cell"><button class="button" data-variant="outline" data-size="icon" type="button" aria-label="Más acciones"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button><figcaption>icon</figcaption></figure>
  <figure class="demo-cell"><button class="button" data-variant="ghost" data-size="icon-sm" type="button" aria-label="Cerrar"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button><figcaption>icon-sm</figcaption></figure>
</div>

<!-- example: states | Estados -->
<div class="demo-grid">
  <figure class="demo-cell"><button class="button" type="button">Guardar</button><figcaption>normal</figcaption></figure>
  <figure class="demo-cell"><button class="button" data-demo="hover" type="button">Guardar</button><figcaption>hover</figcaption></figure>
  <figure class="demo-cell"><button class="button" data-demo="focus" type="button">Guardar</button><figcaption>focus-visible</figcaption></figure>
  <figure class="demo-cell"><button class="button" data-demo="active" type="button">Guardar</button><figcaption>active</figcaption></figure>
  <figure class="demo-cell"><button class="button" type="button" disabled>Guardar</button><figcaption>disabled</figcaption></figure>
  <figure class="demo-cell"><button class="button" type="button" aria-busy="true">Guardando…</button><figcaption>loading</figcaption></figure>
  <figure class="demo-cell"><button class="button" data-variant="outline" data-demo="hover" type="button">Cancelar</button><figcaption>outline · hover</figcaption></figure>
  <figure class="demo-cell"><button class="button" data-variant="outline" data-demo="focus" type="button">Cancelar</button><figcaption>outline · focus</figcaption></figure>
  <figure class="demo-cell"><button class="button" data-variant="outline" type="button" aria-busy="true">Exportando…</button><figcaption>outline · loading</figcaption></figure>
</div>
