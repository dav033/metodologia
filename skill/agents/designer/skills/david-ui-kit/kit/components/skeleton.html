<!-- example: card | Tarjeta cargando -->
<div class="card" data-size="sm" aria-busy="true" aria-label="Cargando cuenta">
  <div class="media"><span class="skeleton" data-shape="circle" style="width:40px;height:40px"></span><span class="stack-sm grow"><span class="skeleton" style="width:40%"></span><span class="skeleton" style="width:65%;height:12px"></span></span></div>
  <span class="skeleton" style="height:12px"></span><span class="skeleton" style="height:12px;width:80%"></span>
</div>

<!-- example: rows | Filas cargando -->
<div class="data-table-frame" aria-busy="true" aria-label="Cargando cuentas"><table class="table"><thead><tr><th>Persona</th><th>Estado</th><th data-align="end">Último acceso</th></tr></thead><tbody>
  <tr><td><span class="skeleton" style="width:160px"></span></td><td><span class="skeleton" style="width:72px"></span></td><td data-align="end"><span class="skeleton" style="width:110px;margin-left:auto"></span></td></tr>
  <tr><td><span class="skeleton" style="width:130px"></span></td><td><span class="skeleton" style="width:72px"></span></td><td data-align="end"><span class="skeleton" style="width:110px;margin-left:auto"></span></td></tr>
  <tr><td><span class="skeleton" style="width:150px"></span></td><td><span class="skeleton" style="width:72px"></span></td><td data-align="end"><span class="skeleton" style="width:110px;margin-left:auto"></span></td></tr>
</tbody></table></div>
