<!-- example: states | Estados -->
<div class="demo-grid">
  <figure class="demo-cell"><input class="switch" type="checkbox" role="switch" aria-label="Apagado"><figcaption>off</figcaption></figure>
  <figure class="demo-cell"><input class="switch" type="checkbox" role="switch" aria-label="Encendido" checked><figcaption>on</figcaption></figure>
  <figure class="demo-cell"><input class="switch" type="checkbox" role="switch" aria-label="Con foco" data-demo="focus" checked><figcaption>focus-visible</figcaption></figure>
  <figure class="demo-cell"><input class="switch" type="checkbox" role="switch" aria-label="Deshabilitado" disabled><figcaption>disabled</figcaption></figure>
  <figure class="demo-cell"><input class="switch" type="checkbox" role="switch" aria-label="Deshabilitado encendido" disabled checked><figcaption>disabled · on</figcaption></figure>
</div>
