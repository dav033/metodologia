<!-- example: states | Estados -->
<div class="demo-grid">
  <figure class="demo-cell"><input class="checkbox" type="checkbox" aria-label="Sin marcar"><figcaption>unchecked</figcaption></figure>
  <figure class="demo-cell"><input class="checkbox" type="checkbox" aria-label="Marcada" checked><figcaption>checked</figcaption></figure>
  <figure class="demo-cell"><input class="checkbox" type="checkbox" aria-label="Algunas" aria-checked="mixed"><figcaption>indeterminate</figcaption></figure>
  <figure class="demo-cell"><input class="checkbox" type="checkbox" aria-label="Con foco" data-demo="focus" checked><figcaption>focus-visible</figcaption></figure>
  <figure class="demo-cell"><input class="checkbox" type="checkbox" aria-label="Obligatoria" aria-invalid="true"><figcaption>error</figcaption></figure>
  <figure class="demo-cell"><input class="checkbox" type="checkbox" aria-label="Deshabilitada" disabled><figcaption>disabled</figcaption></figure>
  <figure class="demo-cell"><input class="checkbox" type="checkbox" aria-label="Deshabilitada marcada" disabled checked><figcaption>disabled · checked</figcaption></figure>
</div>

<!-- example: list | Lista con descripción -->
<div class="stack">
  <label class="choice"><input class="checkbox" type="checkbox" checked><span><span class="font-medium">Chat asistido</span><span>Conversación con el asistente.</span></span></label>
  <label class="choice"><input class="checkbox" type="checkbox" checked><span><span class="font-medium">Catálogo</span><span>Consulta de productos del catálogo.</span></span></label>
  <label class="choice"><input class="checkbox" type="checkbox"><span><span class="font-medium">Taller 3D</span><span>Diseño de montajes en tres dimensiones.</span></span></label>
</div>
