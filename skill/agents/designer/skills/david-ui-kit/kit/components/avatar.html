<!-- example: sizes | Tamaños y tonos -->

  <figure class="demo-cell"><span class="avatar" data-size="sm">AM</span><figcaption>sm</figcaption></figure>
  <figure class="demo-cell"><span class="avatar">AM</span><figcaption>default</figcaption></figure>
  <figure class="demo-cell"><span class="avatar" data-size="lg">AM</span><figcaption>lg</figcaption></figure>
  <figure class="demo-cell"><span class="avatar" data-tone="muted">?</span><figcaption>muted</figcaption></figure>

</div>
