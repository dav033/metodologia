<!-- example: open | Abierto -->

    <div class="dialog-header">
      <h2 class="dialog-title" id="dg-1-title">Invitar persona</h2>
      <p class="dialog-description" id="dg-1-desc">Le enviaremos un enlace de activación válido por 7 días.</p>
    </div>

      <div class="field"><label class="label" for="dg-1-email">Correo</label><input class="input" id="dg-1-email" type="email" placeholder="nombre@empresa.com"></div>

  </div>
</div></div>
