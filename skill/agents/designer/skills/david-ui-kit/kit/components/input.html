<!-- example: states | Estados -->
<div class="demo-grid" data-layout="grid">
  <figure class="demo-cell"><input class="input" aria-label="Nombre" placeholder="Nombre y apellido"><figcaption>placeholder</figcaption></figure>
  <figure class="demo-cell"><input class="input" aria-label="Nombre" value="Ana Martínez"><figcaption>con valor</figcaption></figure>
  <figure class="demo-cell"><input class="input" aria-label="Nombre" value="Ana Martínez" data-demo="focus"><figcaption>focus-visible</figcaption></figure>
  <figure class="demo-cell"><input class="input" aria-label="Nombre" value="" aria-invalid="true" placeholder="Nombre y apellido"><figcaption>error</figcaption></figure>
  <figure class="demo-cell"><input class="input" aria-label="Nombre" value="Ana Martínez" disabled><figcaption>disabled</figcaption></figure>
  <figure class="demo-cell"><input class="input" aria-label="Identificador" value="cuenta-0042" readonly><figcaption>readonly</figcaption></figure>
</div>

<!-- example: types | Tipos -->
<div class="demo-grid" data-layout="grid">
  <figure class="demo-cell"><input class="input" type="email" aria-label="Correo" placeholder="nombre@empresa.com"><figcaption>email</figcaption></figure>
  <figure class="demo-cell"><input class="input" type="password" aria-label="Contraseña" value="contraseña"><figcaption>password</figcaption></figure>
  <figure class="demo-cell"><input class="input tabular" type="number" aria-label="Cantidad" value="120"><figcaption>number</figcaption></figure>
</div>
