# Templates, assets, policy references and agent definitions travel inside the wheel (REQ-007 R2).
# test_package_install.py keeps py-modules complete against skill/scripts.
[tool.setuptools.package-data]
bt_planner = ["data/*.json", "README.md"]
plan_bench = ["data/*.json", "README.md"]
bt_scheduler_core = ["README.md"]
bt_scheduler_decision = ["api-contract.json", "README.md", "laya-requirements.in", "laya-requirements.lock"]
bt_scheduler_executor = ["README.md"]
bt_scheduler_monitor = ["README.md"]
bt_scheduler_recovery = ["README.md"]
bt_scheduler_quality = ["api-contract.json", "README.md"]
bitacora_resources = [
  "SKILL.md", "templates/*", "templates/**/*", "assets/*", "assets/vendor/**/*", "agents/*", "agents/**/*",
  "agents/*/skills/*/SKILL.md", "githooks/*",
  "references/*.md", "references/stacks/*", "vendor/archify/**/*",
]
