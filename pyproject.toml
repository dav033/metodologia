[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitacora"
version = "0.1.0"
description = "Local engineering workspace: bitácora documents, Scheduler runs, provider routing and web UI"
requires-python = ">=3.12"
dependencies = []  # stdlib only; optional Node is a separate capability (REQ-007 M7)

[project.scripts]
bitacora = "bitacora:main"
bt = "bitacora:main"
bt-plan-bench = "bt_plan_bench:main"
bt-scheduler-monitor = "bt_cli_scheduler_monitor:main"
bt-scheduler-monitor-recovery = "bt_scheduler_monitor_recovery:main"
bt-scheduler-recovery = "bt_cli_scheduler_recovery:main"
globalusage = "bt_entrypoints:globalusage"
relay-run = "relay_run:main"
file-guard = "file_guard:main"
install-agents = "install_agents:main"
install-rtk = "bt_entrypoints:install_rtk"
bitacora-inventory = "migration_inventory:main"

[tool.setuptools]
package-dir = {"" = "skill/scripts", "bitacora_resources" = "skill"}
packages = ["bitacora_resources", "bitacora_platform", "bt_planner", "plan_bench", "bt_scheduler_core", "bt_scheduler_decision", "bt_scheduler_executor", "bt_scheduler_monitor", "bt_scheduler_monitor.providers", "bt_scheduler_recovery", "bt_scheduler_quality"]
