# Default gitleaks rules plus: solver state files hold task ids ("key": MD5 hex), not credentials.
[extend]
useDefault = true

[[allowlists]]
description = "Durable solver state and per-pass inbox/trigger files: task-id and trigger keys (hex hashes, optionally prefixed by run:kind), rewritten live so line fingerprints drift"
condition = "AND"
regexTarget = "line"
paths = ['''RUN\.solver/(?:[^/]+/)?[^/]+\.jsonl?$''']
regexes = ['''"key":\s*"(?:[\w.-]+:)*[0-9a-f]{32}"''']
