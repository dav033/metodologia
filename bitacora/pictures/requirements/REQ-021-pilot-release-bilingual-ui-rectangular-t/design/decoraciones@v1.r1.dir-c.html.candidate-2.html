.panel{padding:10px;border-right:1px solid var(--taller-linea);display:grid;gap:8px;align-content:start}.panel h2,.insp h2{font-size:12px;font-weight:600}
.seg{display:flex;gap:4px}.seg b{font-size:11px;font-weight:500;padding:4px 6px;border-radius:6px;color:var(--texto-suave)}.seg b.on{background:var(--taller-elegido);color:var(--texto)}
.row{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center;padding:6px;border:1px solid var(--borde);border-radius:10px;background:var(--taller-tarjeta)}.mini{width:34px;height:28px;border-radius:6px;background:var(--taller-encima);display:grid;place-items:center}
.row small{display:block;color:var(--texto-suave);font-size:10.5px}.row.open{grid-template-columns:1fr;border-color:var(--acento)}.row.open .mini{width:100%;height:56px}
.acts{display:flex;gap:4px;flex-wrap:wrap}.chip{font-size:10.5px;padding:3px 7px;border-radius:999px;border:1px solid var(--texto-tenue);background:var(--superficie)}.chip.pri{background:var(--acento);color:var(--sobre-acento);border-color:var(--acento)}
.insp{padding:10px;border-left:1px solid var(--taller-linea);display:grid;gap:8px;align-content:start}
.form{display:grid;gap:6px;padding:8px;border-radius:10px;background:var(--superficie-2);animation:seat .6s cubic-bezier(.34,1.4,.64,1) both;transform-origin:left}.field{height:22px;border:1px solid var(--texto-tenue);border-radius:8px;background:var(--superficie);font-size:10.5px;padding:3px 6px}
.ok{color:var(--exito);font-size:11px}.lbl{font-size:10.5px;color:var(--texto-suave)}
.tray{grid-column:1/-1;border-top:1px solid var(--taller-linea);background:var(--taller-barra);padding:10px;display:flex;gap:8px;align-items:stretch;overflow:hidden}
.slot{min-width:110px;border:1px dashed var(--texto-tenue);border-radius:10px;display:grid;place-items:center;color:var(--texto-suave);font-size:10.5px;padding:6px;text-align:center}
.tile{min-width:96px;border:1px solid var(--borde);border-radius:10px;background:var(--taller-tarjeta);padding:6px;display:grid;gap:4px;font-size:10.5px}.tile .mini{width:100%;height:36px}.tile.lift{transform:translateY(-6px);border-color:var(--acento);box-shadow:0 6px 14px rgb(0 0 0 / .15)}
.ghost{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:10.5px;padding:3px 8px;border-radius:999px;background:var(--superficie);color:var(--texto-suave)}
@keyframes seat{0%{transform:scaleX(.96)}60%{transform:scaleX(1.01)}100%{transform:none}}
