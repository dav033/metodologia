/* ---------- Accordion ---------- */

/* david-ui stand-in behaviour for static mockups (optional, no network). Inlined by inline.py next to the kit CSS.

     one; Escape and a click outside close the top one; focus moves into the layer and back to its opener.
   - [role=tablist] switches tabs (click, arrows); [data-kit-toast="template-id"] shows a toast for 5 s;
     .combobox filters its .listbox-item by the input; [data-kit-sidebar] toggles the mobile sidebar of .app.
   - Mockup switcher: an element with data-show-view="login reset", data-show-state="error", data-hide-state="loading" or
     data-show-scene="confirm" is shown only while select#view / #state / #scene hold one of those values.
   - A parent page may post {kit: 'set', theme, motion}; the kit applies it and syncs the selects. */
(function () {
  if (window.__kit) return;
  window.__kit = true;
  var root = document.documentElement, stack = [];
  var FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';

  function apply(kind, value) {
    if (!value) return;
    root.setAttribute('data-' + kind, value);
    var sel = document.getElementById(kind);
    if (sel && sel.tagName === 'SELECT' && sel.value !== value && [].some.call(sel.options, function (o) { return o.value === value; })) {
      sel.value = value;
      sel.dispatchEvent(new Event('change', { bubbles: true }));
    }
  }
  function bindSelect(kind) {
    var sel = document.getElementById(kind);
    if (!sel || sel.tagName !== 'SELECT') return;
    sel.addEventListener('change', function () { root.setAttribute('data-' + kind, sel.value); });
    if (!root.getAttribute('data-' + kind) || root.getAttribute('data-' + kind) !== sel.value) root.setAttribute('data-' + kind, sel.value);
  }

  function open(layer, opener) {
    if (!layer) return;
    layer.hidden = false;
    layer.setAttribute('data-state', 'open');
    if (opener) opener.setAttribute('aria-expanded', 'true');
    stack.push({ layer: layer, opener: opener });

    if (target && layer.matches('.dialog-overlay, .sheet-overlay, .sheet-content, [role=dialog], [role=alertdialog]')) target.focus();
  }
  function close(layer) {
    for (var i = stack.length - 1; i >= 0; i--) {
      if (stack[i].layer !== layer) continue;
      var item = stack.splice(i, 1)[0];

      layer.setAttribute('data-state', 'closed');

      if (item.opener) { item.opener.setAttribute('aria-expanded', 'false'); item.opener.focus(); }

  }
  function layerOf(el) { return el.closest('[data-kit-layer]'); }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-kit-open], [data-kit-close], [data-kit-toast], [data-kit-sidebar]');

      var layer = document.getElementById(t.getAttribute('data-kit-open'));
      if (layer && !layer.hidden) close(layer); else open(layer, t);
      var pair = layer && document.querySelector('[data-kit-pair="' + layer.id + '"]');
      if (pair) pair.hidden = layer.hidden;
      ev.preventDefault();
      return;
    }
    if (t && t.hasAttribute('data-kit-close')) { var l = layerOf(t); if (l) close(l); ev.preventDefault(); return; }
    if (t && t.hasAttribute('data-kit-toast')) { toast(t.getAttribute('data-kit-toast')); return; }
    if (t && t.hasAttribute('data-kit-sidebar')) {
      var app = document.querySelector('.app');
      if (app) app.setAttribute('data-sidebar', app.getAttribute('data-sidebar') === 'open' ? 'closed' : 'open');
      return;
    }
    var app2 = document.querySelector('.app[data-sidebar="open"]');
    if (app2 && !ev.target.closest('.sidebar')) app2.setAttribute('data-sidebar', 'closed');
    if (!stack.length) return;
    var top = stack[stack.length - 1].layer;
    if (ev.target === top && top.matches('.dialog-overlay, .sheet-overlay')) { close(top); return; }
    if (!top.contains(ev.target) && !top.matches('.dialog-overlay, .sheet-overlay, .sheet-content')) close(top);
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && stack.length) { close(stack[stack.length - 1].layer); return; }
    var tab = ev.target.closest && ev.target.closest('[role=tab]');
    if (tab && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft')) {
      var tabs = [].slice.call(tab.closest('[role=tablist]').querySelectorAll('[role=tab]:not([disabled])'));
      var next = tabs[(tabs.indexOf(tab) + (ev.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
      select(next); next.focus(); ev.preventDefault();
    }
  });

  function select(tab) {
    var list = tab.closest('[role=tablist]');
    [].forEach.call(list.querySelectorAll('[role=tab]'), function (t) {

      t.setAttribute('aria-selected', on ? 'true' : 'false');

  }
  document.addEventListener('click', function (ev) {
    var tab = ev.target.closest('[role=tab]');

  });

  function toast(templateId) {

  }

  document.addEventListener('input', function (ev) {
    var box = ev.target.closest && ev.target.closest('.combobox');

    if (!list) return;

      var hit = !q || item.textContent.toLowerCase().indexOf(q) >= 0;

    });
    var empty = list.querySelector('.listbox-empty');
    if (empty) empty.hidden = shown > 0;
  });

  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.kit !== 'set' || ev.source !== window.parent) return;
    apply('theme', d.theme); apply('motion', d.motion);
  });

  // mockup switcher: [data-show-view|data-show-state|data-hide-state|data-show-scene]="a b" follow the planning selects
  function val(id) { var s = document.getElementById(id); return s && s.tagName === 'SELECT' ? s.value : ''; }
  function inList(list, v) { return (' ' + list + ' ').indexOf(' ' + v + ' ') >= 0; }
  function switcher() {
    var v = val('view'), s = val('state'), c = val('scene');
    root.setAttribute('data-view', v); root.setAttribute('data-mock-state', s); root.setAttribute('data-scene', c);
    [].forEach.call(document.querySelectorAll('[data-show-view], [data-show-state], [data-hide-state], [data-show-scene]'), function (el) {
      var a = el.getAttribute.bind(el);
      el.hidden = !((!el.hasAttribute('data-show-view') || inList(a('data-show-view'), v)) &&
        (!el.hasAttribute('data-show-state') || inList(a('data-show-state'), s)) &&
        (!el.hasAttribute('data-hide-state') || !inList(a('data-hide-state'), s)) &&
        (!el.hasAttribute('data-show-scene') || (c && inList(a('data-show-scene'), c))));
    });
  }
  document.addEventListener('change', function (ev) {
    if (ev.target && /^(view|state|scene)$/.test(ev.target.id)) switcher();
  });

  function start() {
    bindSelect('theme'); bindSelect('motion');
    switcher();
    var q = new URLSearchParams(location.search);
    apply('theme', q.get('theme')); apply('motion', q.get('motion'));
    [].forEach.call(document.querySelectorAll('[role=tablist]'), function (list) {
      var on = list.querySelector('[role=tab][aria-selected="true"]') || list.querySelector('[role=tab]');

    });

let draftSequence = 0;
let selected = fixtures[0], isNew = false, dirty = false, importConfirmed = false, query = '', ownerFilter = 'all', returnFocus = null, departure = null, saveMode = 'first';
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = name => {
 const paths={plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',back:'<path d="M19 12H5m6-6-6 6 6 6"/>',chevron:'<path d="m6 9 6 6 6-6"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',mark:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>'};

 return `<button type="button" class="button" data-variant="${variant}" data-action="${action}" ${extra}>${text}</button>`;
};
function preview(kind='lilac') {
 const points=[[-66,0],[-67,23],[-63,48],[-59,71],[-48,94],[-29,114],[-5,123],[19,126],[41,115],[-84,10],[-82,35],[-77,62],[-69,86],[-55,110],[-35,133],[-10,144],[15,144]];

}

let toastTimer;

function alertBox(title,text,type='',action='') {
 const variant={failure:'destructive',good:'success',warning:'warning'}[type]||'';
 return `<div class="alert" ${variant?`data-variant="${variant}"`:''} ${type==='failure'?'role="alert"':'role="status"'}><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.5v.01"/></svg><p class="alert-title">${title}</p><p class="alert-description">${text}</p>${action?`<div class="alert-action">${action}</div>`:''}</div>`;
}

function heading(title,subtitle,action=''){return `<div class="page-header"><div><h1 tabindex="-1">${title}</h1><p>${subtitle}</p></div>${action}</div>`;}

function isStaff(){return staffMode;}

 const v=controls.view.value, staff=isStaff();
 const navItem=(text,action,on)=>`<li><button type="button" class="sidebar-menu-button" data-action="${action}" ${on?'aria-current="page"':''}><span>${text}</span></button></li>`;
 const nav=`${canUseTaller?navItem('Mis proyectos','mine',['mine','editor','import'].includes(v)):''}${staff?navItem('Todos los proyectos','all',['all','foreign','foreign-limited'].includes(v)):''}${canUseTaller?navItem('Taller 3D','new',false):''}`;
 return `<aside class="sidebar project-rail" aria-label="Navegación de proyectos"><div class="sidebar-header"><div class="media">${icon('mark')}<span class="media-text"><span class="font-semibold">Pictures</span><span>Taller de decoración</span></span></div></div><div class="sidebar-content"><div class="sidebar-group"><div class="sidebar-group-label">Proyectos</div><ul class="sidebar-menu">${nav}</ul></div></div></aside><div class="app-main"><header class="app-header"><span class="grow font-medium">Pictures · Proyectos</span><div class="menu-root"><button class="button" data-variant="ghost" type="button" aria-label="Menú de cuenta de ${accountName()}" aria-haspopup="menu" aria-expanded="false" data-kit-open="account-menu"><span class="avatar" data-size="sm" data-tone="muted" aria-hidden="true">${staff?'AM':'LT'}</span><span>${accountName()}</span>${icon('chevron')}</button><div class="dropdown-menu-content" id="account-menu" role="menu" data-kit-layer hidden><div class="dropdown-menu-label">${staff?(canUseTaller?'Empleado interno':'Consulta de proyectos'):'Usuario · Plan 3'}</div><button type="button" class="dropdown-menu-item" role="menuitem" data-action="external">Mi cuenta</button><button type="button" class="dropdown-menu-item" role="menuitem" data-action="external">Cerrar sesión</button></div></div></header><nav class="project-tabs" aria-label="Secciones de proyectos"><ul class="row">${nav}</ul></nav><section class="page" id="main" data-show-view="${v}" ${v==='import'&&!['permission-denied','unavailable'].includes(controls.state.value)?'data-width="narrow"':''}>${content}</section></div>`;
}

function emptyState(title,text,action){return `<section class="empty"><div class="empty-header"><h2 class="empty-title">${title}</h2><p class="empty-description">${text}</p></div><div class="empty-content">${action}</div></section>`;}

function loading(){const v=controls.view.value;return `<section aria-busy="true" class="stack" data-show-state="loading"><p role="status" class="text-muted">${v==='import'?'Revisando escena…':['editor','foreign','foreign-limited'].includes(v)?'Abriendo proyecto…':'Cargando proyectos…'}</p><div class="grid project-grid">${[1,2,3].map(()=>'<div class="card" aria-hidden="true"><div class="card-content stack"><span class="skeleton" style="height:calc(var(--spacing) * 32)"></span><span class="skeleton"></span><span class="skeleton" style="width:65%"></span></div></div>').join('')}</div></section>`;}

 if(s==='offline')return alertBox('Sin conexión','No podemos confirmar el guardado en tu cuenta. Conserva esta ventana abierta.'+(['mine','all'].includes(v)?' Mostramos la lista cargada antes de perder la conexión.':''),'warning',button('Reintentar conexión','retry'));
 if(s==='error')return alertBox(isReadOnly()?'No pudimos abrir el proyecto':v==='editor'?'No pudimos guardar el proyecto':v==='import'?'No pudimos importar la escena':'No pudimos cargar los proyectos', isReadOnly()?'Inténtalo de nuevo cuando el servicio responda.':'Tu trabajo sigue aquí. Inténtalo de nuevo cuando el servicio responda.','failure',button('Reintentar','retry'));

}

function library(){const all=controls.view.value==='all',s=controls.state.value;
 let body=heading(all?'Todos los proyectos':'Mis proyectos',all?'Consulta los proyectos guardados de cada cuenta.':'Retoma tu trabajo desde cualquier navegador.',(canUseTaller&&s!=='empty'?button(icon('plus')+'Nuevo proyecto','new','primary'):''))+commonBanner();
 if(s==='loading')return body+loading();
 if(!all && !importReceipts.has(accountName()) && canUseTaller)body+=alertBox('Hay una escena en este navegador','Revisa que sea tuya antes de guardarla en tu cuenta. El original se conserva.','',button('Revisar importación','import'));
 if(s==='empty')return body+emptyState(all?'Aún no hay proyectos guardados':'Aún no tienes proyectos guardados',canUseTaller?'Crea un proyecto en el Taller 3D y guárdalo en tu cuenta.':'Todavía no hay proyectos disponibles para consultar.',canUseTaller?button('Nuevo proyecto','new','primary'):'');
 if(s==='error')return body+`<p class="text-muted">La lista no está disponible. No hemos sustituido tus proyectos por una lista vacía.</p>`;
 body+=`<form id="search-form" class="stack-sm" role="search"><div class="project-filters"><div class="field"><label class="label" for="search">Buscar proyecto</label><input class="input" id="search" type="search" maxlength="120" placeholder="Nombre del proyecto" value="${esc(query)}" aria-describedby="search-hint"></div>${all?`<div class="field"><label class="label" for="owner">Cuenta propietaria</label><span class="select-wrap"><select class="select" id="owner"><option value="all">Todas las cuentas</option>${ownerOptions()}</select></span></div>`:''}</div><p id="search-hint" class="field-description">Busca por nombre en todos ${all?'los proyectos autorizados':'tus proyectos'}. Hasta 120 caracteres.</p></form><div id="project-results" aria-live="polite">${cards()}</div>`;
 return body;
}

function editor(){const foreign=isReadOnly(),s=controls.state.value;
 const locked=['loading','pending','pending-newer','offline','disabled','unknown','stale','too-large'].includes(s)||foreign||(!dirty&&!isNew);
 const status=s==='pending-newer'?'Guardando cambios anteriores · hay cambios nuevos sin guardar':s==='unknown'?'Guardado sin confirmar':s==='pending'?'Guardando en tu cuenta…':s==='offline'?'Solo en este navegador · sin conexión':['error','too-large','draft-error'].includes(s)?'Sin guardar en tu cuenta':s==='stale'?'Versión en conflicto':(dirty||s==='dirty')?'Cambios sin guardar':isNew?'Sin guardar en tu cuenta':'Guardado en tu cuenta · '+esc(selected.date);
 let body=button(icon('back')+(foreign?'Todos los proyectos':'Mis proyectos'),foreign?'all':'mine','ghost');
 body+=`<div class="stack"><div class="page-header"><div><p class="text-sm text-muted">${foreign?'Proyecto guardado':'Taller 3D'}</p><h1 tabindex="-1">${esc(isNew?'Proyecto sin título':selected.name)}</h1></div>${foreign?(canUseTaller?button('Guardar una copia en mi cuenta','copy','primary',['loading','error','offline','unknown'].includes(s)?'disabled':''):''):button(['pending','pending-newer'].includes(s)?'Guardando…':isNew?'Guardar proyecto':'Guardar ahora','save','primary',locked?'disabled':'')}</div><div class="row">${foreign?`<span class="badge" data-variant="secondary">Solo lectura</span><span class="text-muted">Proyecto de ${esc(selected.owner)}</span>`:`<span class="badge" data-variant="${dirty||['offline','error','stale','unknown'].includes(s)?'warning':'success'}" role="status">${s==='pending-newer'?'Guardando':status}</span>${s==='pending-newer'?`<p class="text-sm text-muted" role="status">${status}</p>`:''}`}</div></div>`;
 if(foreign)body+=alertBox('Proyecto de otra cuenta',canUseTaller?'Puedes consultarlo y guardar una copia en tu cuenta. El original pertenece a su propietario y permanece de solo lectura.':'Tu rol permite consultar proyectos. No incluye el Taller 3D ni crear copias.');
 body+=commonBanner();
 if(s==='recovery'||recoveryDrafts.has(draftKey()))body+=alertBox('Hay un borrador de esta cuenta en este navegador','Solo se ofrece a esta cuenta. Recupéralo para revisar los cambios antes de guardarlos.','warning',button('Recuperar borrador','recover'));
 if(s==='loading')return body+loading();
 if(s==='late-response')body+='<p class="text-muted text-xs" role="status">Mockup · Se simuló una respuesta tardía de «Quince años · Valentina». Seguimos en «Boda · Jardín Botánico» con sus cambios sin guardar. No se confirma el proyecto anterior.</p>';
 if(s==='stale')body+=alertBox('Hay una versión más reciente','El guardado está detenido. Tu trabajo sigue aquí.','warning',button('Resolver conflicto','conflict'));
 if(s==='disabled'&&!foreign)body+='<p class="text-muted text-sm">No hay cambios para guardar.</p>';
 body+=`<section class="project-workspace" aria-label="Contexto del Taller 3D"><figure class="stack-sm">${preview(selected.kind)}<figcaption class="text-xs text-muted">Ilustración del visor · La escena 3D real permanece en el Taller.</figcaption></figure><aside class="stack" aria-label="Resumen de la escena"><h2 class="text-base">En esta escena</h2><div class="stack-sm"><p>Guirnalda orgánica</p><p class="text-sm text-muted">${selected.kind==='garden'?'Salvia y crema':selected.kind==='coral'?'Coral y durazno':'Lila y durazno'}</p></div><div class="separator"></div><div class="stack-sm"><p>Panel Chiara</p><p class="text-sm text-muted">Posición conservada</p></div><div class="separator"></div><div class="stack-sm"><p>Pedestal</p><p class="text-sm text-muted">Medidas en el proyecto</p></div><p class="text-sm text-muted">Resumen ilustrativo; sin controles de edición 3D.</p></aside></section>`;
 if(!foreign)body+=`<div class="row">${button('Simular edición','edit')}<p class="text-sm text-muted">Mockup: congela cambios; usa Estado para simular el autoguardado.</p></div>`;
 return body+`<p class="text-sm text-muted">${foreign?'El original no se modifica al abrirlo ni al crear una copia.':'Guardado automático después del primer guardado con nombre. Un respaldo en el navegador no confirma un guardado en tu cuenta.'}</p>`;
}

function importView(){const s=controls.state.value;
 let body=heading('Trae tu escena a tu cuenta','La encontramos en este navegador. Revisa que sea tuya antes de importarla.')+commonBanner();
 if(s==='loading')return body+loading();
 if(s==='empty')return body+emptyState('No hay escenas para importar en este navegador','Tus proyectos guardados en la cuenta siguen disponibles.',button('Ver mis proyectos','mine','primary'));
 const already=s==='already-imported'||(importReceipts.has(accountName())&&s!=='success'),complete=already||s==='success',invalid=s==='validation';
 body+=`<section class="stack-lg"><div class="stack-sm"><p class="text-sm text-muted">Cuenta de destino</p><p class="font-semibold">${accountName()}</p><p class="text-sm text-muted">${isStaff()?'ana@example.test · Equipo interno':'lucia@example.test · Eventos Lila'}</p></div><div class="separator"></div><div class="project-source">${preview()}<div class="stack-sm"><div class="row"><span class="badge" data-variant="secondary">Solo en este navegador</span></div><h2>Quince años · Valentina</h2><p class="text-sm text-muted">Escena encontrada en este navegador</p><p class="text-sm">${complete?'Ya está en tu cuenta.':invalid?'No podemos abrir esta versión de la escena.':'Escena compatible · lista para revisar'}</p></div></div><div class="separator"></div>`;
 if(complete)body+=alertBox(already?'Esta escena ya está en tu cuenta':'Escena importada a tu cuenta','El original sigue en este navegador. Abrir de nuevo no crea otra copia.','good')+button('Abrir proyecto','open-import','primary');
 else if(invalid)body+=alertBox('No se pudo importar','El formato no es compatible. No hemos cambiado ni borrado el original.','failure')+button('Volver a revisar','retry');
 else body+=`<section aria-label="Confirmación de titularidad"><label class="choice project-consent" for="ownership"><input class="checkbox" type="checkbox" id="ownership" ${importConfirmed?'checked':''} ${['pending','unknown'].includes(s)?'disabled':''}><span>Esta escena es mía y quiero guardarla en esta cuenta.</span></label></section><div class="row">${button(s==='pending'?'Importando…':'Importar a mi cuenta','do-import','primary',(!importConfirmed||['disabled','pending','offline','unknown'].includes(s))?'disabled':'')}${button('Ahora no','mine')}</div><p class="text-sm text-muted">${s==='pending'?'Esperando confirmación del servidor.':'Confirma que es tuya para habilitar la importación.'}</p>`;
 body+=`<p class="text-sm text-muted">Se guardan el nombre y la escena completa: sala, ambiente, salón, materiales y relaciones entre piezas. La conversación y las imágenes de IA siguen en este navegador. Los datos locales se conservan.</p><div class="separator"></div><div class="stack-sm"><p class="text-sm text-muted">El original se conserva incluso si la importación falla.</p>${button('Descargar copia original','download','ghost')}</div></section>`;
 return body;
}

function render(){let content;
 if(controls.state.value==='permission-denied')content=heading('No tienes acceso a estos proyectos','Tu cuenta no tiene permiso para abrir esta sección.')+emptyState('Acceso no disponible','Vuelve a una herramienta permitida o consulta al administrador.',button('Volver al inicio','home','primary'));
 else if(controls.state.value==='unavailable')content=heading('Proyecto no disponible','No encontramos este proyecto o tu cuenta no tiene acceso.')+emptyState('No se puede abrir el proyecto','Vuelve a la lista de proyectos a los que tienes acceso.',button(isStaff()?'Todos los proyectos':'Mis proyectos',isStaff()?'all':'mine','primary'));
 else content=['mine','all'].includes(controls.view.value)?library():controls.view.value==='import'?importView():editor();
 $('app').innerHTML=shell(content);document.documentElement.dataset.view=controls.view.value;document.documentElement.dataset.mockState=controls.state.value;document.documentElement.dataset.scene=controls.scene.value;
}
function setView(v,focus=false){invalidateQuery();if(modal.open)closeDialog();controls.view.value=v;controls.state.value='ready';controls.scene.value='none';dirty=false;render();if(focus)document.querySelector('main h1')?.focus();}
function hasUnconfirmedWork(){return dirty||['pending','pending-newer','unknown'].includes(controls.state.value);}
function requestNavigation(v,nextProject=null){if(hasUnconfirmedWork()){departure={view:v,project:nextProject};openDialog('leave');return;}if(nextProject){selected=nextProject;isNew=false;}setView(v,true);}
function closeDialog(){departure=null;if(modal.open)modal.close();controls.scene.value='none';if(returnFocus?.isConnected&&returnFocus!==document.body&&!modal.contains(returnFocus))returnFocus.focus();else (document.querySelector('[data-action="conflict"]')||document.querySelector('main h1')||controls.scene).focus();}
function openDialog(kind){if(!modal.open)returnFocus=document.activeElement;controls.scene.value=kind;drawDialog(kind);if(!modal.open)modal.showModal();const first=['save','copy'].includes(kind)?$('project-name'):kind==='conflict'?$('modal-title'):$('stay');first?.focus();}
function drawDialog(kind){const s=controls.state.value;let title,description,content;
 if(kind==='save'||kind==='copy'){
  title=saveMode==='copy'?'Guardar una copia':'Guardar proyecto';description='El proyecto se guardará en la cuenta que se indica abajo.';
  const name=saveMode==='copy'?selected.name+' · copia':isNew?'Proyecto sin título':selected.name;
  content=`<form id="save-form" class="stack" novalidate><p class="text-sm text-muted">Cuenta de destino: ${accountName()}</p><div class="field"><label class="label" for="project-name">Nombre del proyecto</label><input class="input" id="project-name" name="name" maxlength="120" value="${s==='validation'?'':esc(name)}" aria-describedby="name-hint name-error" ${s==='validation'?'aria-invalid="true"':''}><p id="name-hint" class="field-description">De 1 a 120 caracteres.</p><p id="name-error" class="field-error" role="alert">${s==='validation'?'Escribe un nombre para el proyecto.':''}</p></div>${['error','unknown','too-large'].includes(s)?commonBanner():''}${s==='pending'?'<p role="status" class="text-sm text-muted">Guardando en tu cuenta… Cerrar este diálogo no cancela el intento enviado.</p>':''}<div class="dialog-footer">${button('Cancelar','close')}<button type="submit" class="button" ${['pending','unknown','too-large'].includes(s)?'disabled':''}>${s==='pending'?'Guardando…':'Guardar en mi cuenta'}</button></div></form>`;
 }else if(kind==='conflict'){
  title='Hay una versión más reciente';description='Otra sesión guardó cambios después de que abriste este proyecto. Tu trabajo sigue aquí.';
  content=`<div class="stack"><div class="row" data-justify="between"><strong>Tu trabajo</strong><span class="text-sm text-muted tabular">Cambios sin guardar · esta ventana</span></div><div class="separator"></div><div class="row" data-justify="between"><strong>En tu cuenta</strong><span class="text-sm text-muted tabular">26 oct 2026, 14:36 · hora local</span></div><div class="dialog-footer">${button('Seguir aquí','close')}${button('Abrir versión guardada','load-newer')}${button('Guardar una copia','copy','primary')}</div></div>`;
 }else{
  title='Tienes cambios sin guardar';description='Guarda en tu cuenta o conserva un borrador para retomarlo en este navegador. El borrador solo estará disponible para esta cuenta.';
  const reason=['pending','pending-newer'].includes(s)?'Hay un guardado en curso. Espera su confirmación para guardar y continuar.':s==='unknown'?'No pudimos confirmar el guardado. Comprueba el resultado antes de guardar y continuar.':s==='offline'?'Sin conexión. No podemos guardar en tu cuenta; puedes conservar un borrador en este navegador.':'';
  content=`<div class="stack">${reason?`<p role="status" class="text-sm text-muted">${reason}</p>`:''}${s==='draft-error'?commonBanner():''}<div class="dialog-footer">${button('Conservar borrador y salir','discard')}<button type="button" class="button" data-variant="outline" data-action="close" id="stay">Seguir aquí</button>${button('Guardar y continuar','save-and-leave','primary',['pending','pending-newer','unknown','offline'].includes(s)?'disabled':'')}</div></div>`;
 }
 modal.innerHTML=`<div class="dialog-content" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-description" data-show-scene="${kind}"><div class="dialog-header"><h2 class="dialog-title" id="modal-title" tabindex="-1">${title}</h2><p class="dialog-description" id="modal-description">${description}</p></div>${content}<button type="button" class="button dialog-close" data-variant="ghost" data-size="icon-sm" data-action="close" aria-label="Cerrar diálogo">${icon('close')}</button></div>`;
}

function finishSave(name){const requestedDeparture=departure;selected={...selected,id:isNew||saveMode==='copy'?'p'+(fixtures.length+1):selected.id,name,owner:isStaff()?'Ana Morales':'Lucía Torres',own:true,date:'26 oct 2026, 14:32',updatedAt:'2026-10-26T14:32:00',ownerId:ownerIds[accountName()]};if(!fixtures.some(p=>p.id===selected.id))fixtures.unshift(selected);else fixtures[fixtures.findIndex(p=>p.id===selected.id)]=selected;isNew=false;dirty=false;recoveryDrafts.delete(draftKey());controls.view.value='editor';controls.state.value='success';closeDialog();render();announce('Simulación: proyecto guardado en tu cuenta.');if(requestedDeparture){const next=requestedDeparture;departure=null;if(next.project)selected=next.project;if(next.view==='new'){act('new');}else if(next.view==='newer'){setView('editor',true);}else setView(next.view,true);}}
function act(action){switch(action){
 case 'mine':case 'all':requestNavigation(action);break;
 case 'import':importConfirmed=false;setView('import',true);break;
 case 'new':if(hasUnconfirmedWork()){departure={view:'new'};openDialog('leave');break;}selected={...ownFixture(),id:'local-draft-'+(++draftSequence),name:'Proyecto sin título'};isNew=true;setView('editor',true);dirty=true;controls.state.value='dirty';render();break;
 case 'edit':dirty=true;controls.state.value=controls.state.value==='stale'?'stale':['pending','pending-newer'].includes(controls.state.value)?'pending-newer':controls.state.value==='offline'?'offline':'dirty';render();announce('Simulación: has cambiado la escena.');break;
 case 'save':saveMode='first';if(isNew)openDialog('save');else finishSave(selected.name);break;
 case 'copy':saveMode='copy';openDialog('copy');break;
 case 'conflict':openDialog('conflict');break;
 case 'close':closeDialog();break;
 case 'recover':recoveryDrafts.delete(draftKey());dirty=true;controls.state.value='dirty';render();announce('Simulación: borrador de esta cuenta recuperado. Se comprobará la revisión antes de guardar.');break;
 case 'reconcile':if(controls.view.value==='import')importReceipts.set(accountName(),'import-'+accountName());controls.state.value=dirty?'dirty':'success';if(modal.open)closeDialog();render();announce('Simulación: el intento anterior está confirmado.');break;
 case 'reload-list':scheduleQuery(true);break;
 case 'more':{if(controls.state.value==='page-loading')break;const key=queryKey(),generation=queryGeneration;controls.state.value='page-loading';refreshResults();pageTimer=setTimeout(()=>applyQueryResponse(key,generation,()=>{loadedLimit+=50;controls.state.value='ready';refreshResults();announce('Simulación: siguiente página cargada.');}),450);break;}
 case 'retry':controls.state.value='ready';render();announce('Simulación: conexión restablecida. Puedes volver a intentarlo.');break;
 case 'clear':query='';ownerFilter='all';invalidateQuery();controls.state.value='ready';render();$('search')?.focus();scheduleQuery(true);break;
 case 'do-import':if(!importConfirmed)return;importReceipts.set(accountName(),'import-'+accountName());controls.state.value='success';render();announce('Simulación: escena importada. El original se conserva.');break;
 case 'open-import':{const id=importReceipts.get(accountName())||'import-'+accountName();selected={...fixtures.find(p=>p.id==='p1'),id,owner:accountName(),ownerId:ownerIds[accountName()],own:true};if(!fixtures.some(p=>p.id===id))fixtures.unshift(selected);}isNew=false;setView('editor',true);break;
 case 'download':{const raw=controls.state.value==='validation'?invalidLegacyRaw:legacyRaw;const blob=new Blob([raw],{type:'application/json'});const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download='escena-original-mockup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);announce('Se descargó una copia ficticia; no se leyó el almacenamiento del navegador.');break;}
 case 'load-newer':departure={view:'newer'};openDialog('leave');break;
 case 'retry-draft':controls.state.value='dirty';announce('Simulación: respaldo local conservado para esta cuenta. Sigue sin guardarse en el servidor.');if(departure)act('discard');else{recoveryDrafts.set(draftKey(),{...selected});if(modal.open)closeDialog();render();}break;
 case 'discard':{if(controls.state.value==='draft-error'){announce('Simulación: el respaldo local falló. Sigues aquí y tu trabajo se conserva en esta ventana.');return;}recoveryDrafts.set(draftKey(),{...selected});const next=departure;departure=null;dirty=false;closeDialog();if(next?.view==='new'){act('new');}else if(next?.view==='newer'){controls.state.value='ready';render();announce('Simulación: versión guardada abierta.');}else{if(next?.project)selected=next.project;setView(next?.view||'mine',true);}break;}
 case 'save-and-leave':if(controls.state.value==='stale'){openDialog('conflict');break;}if(isNew){saveMode='first';openDialog('save');}else{saveMode='first';finishSave(selected.name);}break;
 case 'external':announce('Destino fuera de SP-4: el producto usa las pantallas de cuentas de SP-2.');break;
 case 'home':announce('Destino fuera de SP-4: primera herramienta permitida por tu cuenta.');break;
 }}
document.addEventListener('click',e=>{const open=e.target.closest('[data-open]');if(open){const p=fixtures.find(x=>x.id===open.dataset.open);requestNavigation(p.owner===accountName()&&canUseTaller?'editor':canUseTaller?'foreign':'foreign-limited',p);return;}const control=e.target.closest('[data-action]');if(control&&!control.disabled)act(control.dataset.action);});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;scheduleQuery();}});
document.addEventListener('change',e=>{if(e.target.id==='owner'){ownerFilter=e.target.value;scheduleQuery(true);}if(e.target.id==='ownership'){importConfirmed=e.target.checked;if(controls.state.value==='disabled')controls.state.value='ready';const b=document.querySelector('[data-action="do-import"]');if(b)b.disabled=!importConfirmed||['offline','pending','unknown'].includes(controls.state.value);}});
document.addEventListener('submit',e=>{if(e.target.id==='search-form'){e.preventDefault();scheduleQuery(true);return;}if(e.target.id!=='save-form')return;e.preventDefault();const field=$('project-name');const name=field.value.trim();if(['pending','unknown','too-large'].includes(controls.state.value))return;if(!name){$('name-error').textContent='Escribe un nombre para el proyecto.';field.setAttribute('aria-invalid','true');field.focus();return;}finishSave(name);});
modal.addEventListener('cancel',e=>{e.preventDefault();closeDialog();});
controls.view.addEventListener('change',()=>{const v=controls.view.value;staffMode=['all','foreign','foreign-limited'].includes(v);canUseTaller=v!=='foreign-limited';selected=['foreign','foreign-limited'].includes(v)?fixtures.find(p=>p.owner==='Mateo Ruiz'):(fixtures.find(p=>p.owner===accountName())||fixtures[0]);isNew=false;importConfirmed=false;query='';ownerFilter='all';setView(v);});
controls.theme.addEventListener('change',()=>document.documentElement.dataset.theme=controls.theme.value);
controls.state.addEventListener('change',()=>{
 const s=controls.state.value;invalidateQuery();closeDialog();dirty=['dirty','stale','late-response','pending-newer','draft-error','too-large'].includes(s);
 const ownStates=['stale','dirty','pending','pending-newer','recovery','late-response','draft-error','too-large'];
 if(ownStates.includes(s)&&controls.view.value!=='import'){controls.view.value='editor';canUseTaller=true;selected=ownFixture();}
 if(s==='disabled'&&!['editor','foreign','foreign-limited','import'].includes(controls.view.value)){controls.view.value='editor';selected=ownFixture();}
 if(s==='unknown'&&!['editor','import'].includes(controls.view.value)){controls.view.value='editor';canUseTaller=true;selected=ownFixture();}
 if(s==='success'&&isReadOnly())controls.state.value='ready';
 if(['empty','no-results'].includes(s)&&['editor','foreign','foreign-limited'].includes(controls.view.value))controls.view.value=canUseTaller?'mine':'all';
 if(s==='no-results'&&controls.view.value==='import')controls.view.value=canUseTaller?'mine':'all';
 if(['partial','query-loading','query-late-response','page-loading','cursor-invalid'].includes(s)&&!['mine','all'].includes(controls.view.value))controls.view.value=canUseTaller?'mine':'all';
 if(['partial','page-loading'].includes(s)){query='';ownerFilter='all';}
 if(s==='query-late-response'){ownerFilter='all';query='Horizonte';const oldKey=JSON.stringify({...normalizedFilters(),q:'boda'});applyQueryResponse(oldKey,queryGeneration-1,()=>{query='Boda';});}
 if(s==='no-results')query='Proyecto inexistente';
 if(s==='validation'&&controls.view.value!=='import'){controls.view.value='editor';canUseTaller=true;selected=ownFixture();}
 if(s==='late-response'){staffMode=false;canUseTaller=true;selected=fixtures.find(p=>p.id==='p2');}
 if(s==='already-imported'){controls.view.value='import';canUseTaller=true;importReceipts.set(accountName(),'import-'+accountName());}
 if(s==='disabled')importConfirmed=false;
 if(s==='success'&&controls.view.value==='import')importReceipts.set(accountName(),'import-'+accountName());
 if(['ready','validation','disabled','unknown'].includes(s)&&controls.view.value==='import'){importReceipts.delete(accountName());importConfirmed=false;}
 if(controls.view.value==='import'&&['dirty','stale','recovery','late-response','draft-error','too-large','pending-newer'].includes(s)){controls.view.value='editor';selected=ownFixture();}
 render();if(s==='stale')openDialog('conflict');if(s==='validation'&&controls.view.value!=='import'){saveMode='first';openDialog('save');}
});
controls.scene.addEventListener('change',()=>{
 invalidateQuery();const kind=controls.scene.value;if(kind==='none'){closeDialog();return;}
 canUseTaller=true;
 if(kind==='copy'){staffMode=true;selected=fixtures.find(p=>p.owner==='Mateo Ruiz');controls.view.value='foreign';saveMode='copy';}
 else{controls.view.value='editor';selected=ownFixture();}
 if(kind==='conflict'){controls.state.value='stale';dirty=true;}
 if(kind==='leave'){dirty=true;if(!['pending','pending-newer','unknown','offline','draft-error'].includes(controls.state.value))controls.state.value='dirty';departure={view:'mine'};}
 if(kind==='save')saveMode='first';
 render();openDialog(kind);
});
render();

</script>
</body>
</html>
