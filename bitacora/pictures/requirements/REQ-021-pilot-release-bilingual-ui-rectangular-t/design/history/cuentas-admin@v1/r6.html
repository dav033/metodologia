function updatedNoticeView(){if(state==='loading')return shell(authFrame(loading(),true),false);if(state==='success')return shell(authFrame(`<div class="resultmark" aria-hidden="true">${icons.check}</div><h1 tabindex="-1">Aviso aceptado</h1><p role="status">Registramos la versión actual y la fecha de tu aceptación.</p><p class="muted">En el producto volverías a la página solicitada si tu rol permite abrirla; si no, a Taller 3D, chat o catálogo según tus permisos, o a Mi cuenta (/cuenta) cuando tu rol no incluya ninguna de esas herramientas.</p>${button('Continuar','home','primary full')}`,true),false);return shell(authFrame(`<div><h1 tabindex="-1">Revisa el aviso actualizado</h1><p class="intro muted">Actualizamos el aviso de tratamiento de datos. Léelo y acepta la versión actual para continuar.</p><p class="small wrap">${escapeHTML(sessionAccount().name)} · ${escapeHTML(sessionAccount().email)}</p></div>${stateBanner()}<form id="notice-form" novalidate aria-busy="${busy()}">${noticeContent(2)}<label class="checkline spacer" for="accept"><input id="accept" name="accept" type="checkbox" required${draft.accepted?' checked':''}${disabled(blocked())}${state==='validation'&&!draft.accepted?' aria-invalid="true" aria-describedby="accept-error"':''}><span>He leído el aviso y autorizo el tratamiento descrito.</span></label>${state==='validation'&&!draft.accepted?'<p id="accept-error" class="field-error">Acepta la versión actual para continuar o cierra sesión.</p>':''}<button type="submit" class="btn primary full spacer"${disabled(blocked())}>${state==='pending'?'Aceptando…':'Aceptar y continuar'}</button>${state==='disabled'?'<p class="help">Lee el aviso y marca la aceptación antes de continuar.</p>':''}${state==='notice_pending'?'<p class="help">La aceptación espera los datos legales y la revisión de Sempertex.</p>':''}</form>${button('Cerrar sesión','logout','ghost full')}`,true),false);}
function accessSummary(id){if(!id)return '<p class="muted spacer">Elige un rol para revisar las herramientas que tendrá esta persona.</p>';const role=roleById(id);return `<p class="small muted spacer">${role.count} permisos · Un solo rol por cuenta</p><ul class="permissionlist">${permissions.filter(p=>role.perms.includes(p[0])).map(p=>`<li>${p[1]}</li>`).join('')}</ul>`;}
function filterAccounts(){if(state==='empty'||state==='no_results')return [];return accounts.filter(a=>(!search||`${a.name} ${a.email}`.toLocaleLowerCase().includes(search.toLocaleLowerCase()))&&(!statusFilter||a.status===statusFilter)&&(!roleFilter||a.role===roleFilter));}
function accountListings(){const rows=filterAccounts();if(!rows.length)return `<section class="card empty"><h2>${state==='empty'?'Aún no hay cuentas':'No hay cuentas con estos filtros'}</h2><p class="muted">${state==='empty'?'Invita a una persona y asígnale el acceso que necesita.':'Prueba con otro nombre, correo, estado o rol.'}</p>${state==='empty'?link('Invitar persona','invite','btn primary'):button('Limpiar filtros','clear-filters')}</section>`;return `<div class="listmeta"><span>${rows.length} ${rows.length===1?'cuenta':'cuentas'}${search||statusFilter||roleFilter?' con estos filtros':''}</span><span>Fechas en Bogotá (UTC−5)</span></div><div class="card tablecard"><table><caption>Cuentas del piloto</caption><thead><tr><th scope="col">Persona</th><th scope="col">Empresa</th><th scope="col">Rol o plan</th><th scope="col">Estado</th><th scope="col">Último acceso</th><th scope="col"><span class="visually-hidden">Acciones</span></th></tr></thead><tbody>${rows.map(a=>`<tr><td><strong>${escapeHTML(a.name)}</strong><div class="small wrap">${escapeHTML(a.email)}</div></td><td class="small wrap">${escapeHTML(a.company)}</td><td>${roleById(a.role).name}</td><td>${badge(a.status)}</td><td>${state==='stale'?'No disponible':a.last}</td><td>${button('Ver cuenta','open-account','ghost',false,`data-id="${a.id}" aria-label="Ver cuenta de ${a.name}"`)}</td></tr>`).join('')}</tbody></table></div><div class="accountcards">${rows.map(a=>`<article class="card"><div class="row"><div class="grow"><h2>${a.name}</h2><p class="small muted wrap">${a.email}</p></div></div><dl class="mobilefacts"><div class="wide"><dt>Empresa</dt><dd>${escapeHTML(a.company)}</dd></div><div><dt>Rol o plan</dt><dd>${roleById(a.role).name}</dd></div><div><dt>Estado</dt><dd>${badge(a.status)}</dd></div><div class="wide"><dt>Último acceso · Bogotá</dt><dd>${state==='stale'?'No disponible':a.last}</dd></div></dl>${button('Ver cuenta','open-account','',false,`data-id="${a.id}" aria-label="Ver cuenta de ${a.name}"`)}</article>`).join('')}</div>`;}
function accountsView(){return title('Cuentas','Invita personas y administra el acceso a Pictures.',link(icons.plus+'Invitar persona','invite','btn primary'))+stateBanner()+`<section class="filters" aria-label="Buscar y filtrar cuentas"><div class="field"><label for="search">Buscar nombre o correo</label><input id="search" type="search" placeholder="Buscar una persona…" value="${escapeHTML(search)}"></div><div class="field"><label for="status-filter">Estado</label><select id="status-filter"><option value="">Todos los estados</option>${[['active','Activa'],['invited','Invitada'],['inactive','Desactivada']].map(([v,l])=>`<option value="${v}"${statusFilter===v?' selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label for="role-filter">Rol o plan</label><select id="role-filter"><option value="">Todos los roles</option>${roles.map(r=>`<option value="${r.id}"${roleFilter===r.id?' selected':''}>${r.name}</option>`).join('')}</select></div></section><div id="account-results">${accountListings()}</div>`;}
function inviteView(){if(state==='success')return `${link(icons.back+'Cuentas','accounts','back')}${title('Invitación creada','Copia el enlace y compártelo directamente con la persona.')}<section class="card pad formwidth stack"><div class="row"><div class="resultmark" aria-hidden="true" style="margin:0">${icons.check}</div><div class="grow"><h2>${escapeHTML(draft.name||'Luis Rojas')}</h2><p class="muted wrap">${escapeHTML(draft.email||'luis.rojas@example.com')}</p></div></div><div><span class="badge system">${roleById(draft.inviteRole||'p2').name}</span><p class="help">Un solo uso · Vence el 2 nov 2026, 15:40 (Bogotá), 7 días después de su creación.</p></div><div class="banner">Compártelo directamente con esta persona. No se envió ningún correo.</div><div id="invite-link" class="linkbox" tabindex="0" aria-label="Enlace ficticio de activación, seleccionable">https://pictures.example.invalid/activar/mock-invitation-not-a-real-token</div><div class="inlineactions">${button('Copiar enlace','copy-invite','primary')}${link('Volver a cuentas','accounts')}</div><p class="help">Si no puedes copiarlo con el botón, selecciona el enlace y cópialo manualmente. Al salir no se vuelve a mostrar este enlace.</p></section>`;
return `${link(icons.back+'Cuentas','accounts','back')}${title('Invitar persona','Primero revisa a quién invitas y qué acceso tendrá.')}${stateBanner()}<form id="invite-form" novalidate aria-busy="${busy()}"><div class="two"><section class="card pad">${field('name','Nombre','text',draft.name)}${field('email','Correo','email',draft.email,'El enlace será válido solo para esta cuenta.')}${field('company','Empresa','text',draft.company,'',false)}<div class="field"><label for="invite-role">Rol o plan</label>${selectRole('invite-role',draft.inviteRole,blocked(),true)}<p class="help">Los planes son roles. Esta persona tendrá un único rol.</p>${state==='validation'?'<p class="field-error" id="role-error">Elige el rol de la persona.</p>':''}</div></section><aside class="card pad summarybox" aria-label="Vista previa de acceso"><div class="eyebrow">Acceso que otorgas</div><h2 class="spacer" id="invite-role-title">${draft.inviteRole?roleById(draft.inviteRole).name:'Sin rol seleccionado'}</h2><div id="invite-access">${accessSummary(draft.inviteRole)}</div></aside></div><div class="spacer inlineactions"><button type="submit" class="btn primary"${disabled(blocked())}>${state==='pending'?'Creando invitación…':'Crear invitación'}</button>${link('Cancelar','accounts')}</div>${state==='disabled'?'<p class="help">Completa nombre, correo y rol para crear la invitación.</p>':''}<p class="help spacer">Crearás un enlace de un solo uso válido por 7 días. No se enviará un correo automáticamente.</p></form>`;}
function accountView(){const a=currentAccount(),last=state==='last_admin'||isLastAdmin(),off=blocked()||last;return `${link(icons.back+'Cuentas','accounts','back')}${title(a.name,'Revisa su acceso y el estado de la cuenta.')}${stateBanner()}${state==='success'?`<div class="banner success screenbanner" role="status">${lastAction||'Rol actualizado. El cambio se aplicará en la próxima solicitud de la cuenta.'}</div>`:''}${last?'<div class="banner warning screenbanner">Esta cuenta es el último Administrador activo. No puedes cambiar su rol, desactivarla ni eliminarla.</div>':''}<div class="detailgrid"><aside class="card pad"><h2 class="spacer">${a.name}</h2><p class="small muted wrap spacer">${a.email}</p><p class="small muted spacer">${a.company}</p><div class="spacer">${badge(a.status)}</div><dl class="details"><dt>Invitación</dt><dd>${a.invited}</dd><dt>Activación</dt><dd>${a.activated}</dd><dt>Último acceso</dt><dd>${state==='stale'?'No disponible':a.last}</dd><dt>Aviso de datos</dt><dd>${a.notice}</dd></dl><p class="help spacer">Fechas en Bogotá (UTC−5).</p></aside><div class="stack"><form id="account-form" class="card pad" novalidate aria-busy="${busy()}"><h2>Rol y acceso</h2><p class="muted small spacer">Los cambios se aplican en la próxima solicitud, sin volver a iniciar sesión.</p><div class="field spacer"><label for="account-role">Rol o plan asignado</label>${selectRole('account-role',state==='validation'?'':last?'admin':desiredRole,off,state==='validation')}${state==='validation'?'<p class="field-error" id="role-error">Selecciona el rol de la cuenta.</p>':''}</div><div id="account-access">${accessSummary(last?'admin':desiredRole)}</div><button class="btn primary spacer" type="submit"${disabled(off||desiredRole===a.role)} aria-describedby="account-role-help"> ${state==='pending'?'Guardando…':'Guardar rol'}</button><p class="help" id="account-role-help">${desiredRole===a.role||state==='disabled'?'No hay cambios de rol pendientes. Guarda cuando selecciones otro rol.':'Revisa los permisos del nuevo rol antes de guardar.'}</p></form><div class="accessactions"><section class="card pad stack"><h2>Recuperación de acceso</h2>${a.status==='invited'?`<p class="muted">Esta persona aún no activó su cuenta. Crea un enlace nuevo de 7 días; los enlaces de invitación anteriores que no se hayan usado dejarán de funcionar.</p>${button('Generar enlace nuevo','replace_invite','',blocked())}`:`<p class="muted">Crea un enlace de un solo uso, válido por 24 horas. Todas sus sesiones se cierran cuando la persona cambia su contraseña. Los enlaces de restablecimiento anteriores sin usar dejarán de funcionar.</p>${button('Crear enlace de restablecimiento','reset_link','',blocked())}`}${inviteRegenerated?`<div class="banner success" role="status">Invitación reemplazada. Los enlaces de invitación anteriores sin usar ya no funcionan. Vence el 2 nov 2026, 15:40 (Bogotá).</div><div id="renewed-invite-link" class="linkbox" tabindex="0">https://pictures.example.invalid/activar/mock-replaced-invitation-${invitationGeneration}</div>${button('Copiar enlace','copy-renewed-invite')}<p class="help">Compártelo directamente. No se envió un correo. Al salir no se vuelve a mostrar.</p>`:''}${resetCreated?`<div class="banner success" role="status">Enlace creado. Vence el 27 oct 2026, 15:40 (Bogotá). No se envió un correo. Copia el enlace ahora: al salir no se vuelve a mostrar.</div><div class="linkbox" id="reset-link" tabindex="0">https://pictures.example.invalid/restablecer/mock-reset-not-a-real-token-${resetGeneration}</div>${button('Copiar enlace','copy-reset')}`:''}</section><section class="card pad stack"><div class="dangerzone" style="border:0;padding:0"><h2>Estado y eliminación</h2><p class="muted spacer">Desactivar corta el acceso y conserva los datos. Las cuentas con proyectos o decoraciones guardados solo se pueden desactivar. Al eliminar la cuenta, el gasto de IA se conserva sin datos personales como Cuenta eliminada.</p></div><div class="inlineactions">${a.status==='inactive'?button('Reactivar cuenta','reactivate','',blocked()):button('Desactivar cuenta','deactivate','danger',off)}${button('Eliminar cuenta','delete_account','danger',off||['has_work','eligibility_unknown'].includes(state))}</div>${last?'<p class="help">Debe permanecer al menos un Administrador activo.</p>':''}${state==='has_work'?'<div class="banner warning">Esta cuenta tiene trabajo guardado. Puedes desactivarla para conservarlo. No se puede eliminar.</div>':state==='eligibility_unknown'?`<div class="banner warning">No pudimos comprobar si tiene trabajo guardado. Comprueba de nuevo antes de eliminar.${button('Comprobar de nuevo','retry','ghost')}</div>`:'<p class="help">Esta vista normal simula una cuenta sin trabajo guardado. El servidor vuelve a comprobarlo antes de eliminarla.</p>'}</section></div></div></div>`;}
function roleRow(r,system){return `<article class="roleitem"><div class="grow"><h3>${escapeHTML(r.name)}</h3><p class="small muted">${system?'Del sistema · Solo lectura':'Personalizado'}</p></div><div class="rolefigures"><span><strong>${r.count}</strong>permisos</span><span><strong>${state==='stale'?'—':r.assigned}</strong>${state==='stale'?'sin actualizar':r.assigned===1?'cuenta':'cuentas'}</span></div>${system?button('Ver rol','open-system','ghost',false,`data-id="${r.id}" aria-label="Ver ${r.name}"`):button('Editar rol','edit-custom','ghost',state==='stale',`data-id="${r.id}"`)}</article>`;}
function rolesView(){return `${title('Roles y permisos','Revisa qué herramientas incluye cada rol y cuántas personas lo tienen.',button(icons.plus+'Crear rol','new-role','primary',state==='stale'))}${stateBanner()}<section class="roles-columns"><div><div class="sectionheading"><h2>Roles del sistema</h2><span class="small">Solo lectura</span></div><div class="card rolelist">${roles.slice(0,5).map(r=>roleRow(r,true)).join('')}</div></div><div><div class="sectionheading"><h2>Roles personalizados</h2><span class="small">Permisos elegidos por el equipo</span></div>${state==='empty'||roles.length===5?`<section class="card empty"><h2>Aún no hay roles personalizados</h2><p class="muted">Los cinco roles del sistema ya están disponibles. Crea uno si necesitas otra combinación de permisos.</p>${button('Crear rol','new-role','',state==='stale')}</section>`:`<div class="card rolelist">${roles.slice(5).map(r=>roleRow(r,false)).join('')}</div>`}</div></section>`;}
function permissionSummary(keys){return `<p class="small muted spacer summary-count">${keys.size} de ${permissions.length} permisos seleccionados</p>${keys.size?`<ul class="permissionlist">${permissions.filter(p=>keys.has(p[0])).map(p=>`<li>${p[1]}</li>`).join('')}</ul>`:'<p class="muted spacer">Selecciona permisos para revisar el acceso de este rol.</p>'}`;}
function roleView(){const fixed=state==='fixed',role=roleById(selectedRole),assigned=state==='role_in_use'?2:role.assigned,keys=fixed?new Set(role.perms):selectedPermissions;const off=blocked()||fixed;return `${link(icons.back+'Roles y permisos','roles','back')}${title(fixed?role.name:roleMode==='new'?'Crear rol':'Editar rol',fixed?'Los roles del sistema mantienen los permisos definidos para el piloto.':'Elige exactamente las herramientas que necesita este grupo de personas.',fixed?'':`<div class="saveaction"><button class="btn primary" type="submit" form="role-form"${disabled(off)}>${state==='pending'?'Guardando…':'Guardar rol'}</button>${state==='disabled'?'<p class="help">Completa el nombre y selecciona al menos un permiso antes de guardar.</p>':''}</div>`)}${stateBanner()}${state==='success'?'<div class="banner success screenbanner" role="status">Rol guardado. Sus permisos se aplicarán en la próxima solicitud de las cuentas asignadas.</div>':''}${fixed?'<p class="banner screenbanner">Rol del sistema · Solo lectura. No se puede editar ni eliminar.</p>':''}<form id="role-form" class="role-editor" novalidate aria-busy="${busy()}"><div class="two"><section class="card pad">${field('roleName','Nombre del rol','text',fixed?role.name:draft.roleName,'Un nombre que explique para quién es este acceso.',true,fixed)}<div class="row spread"><h2 id="permissions-title">Permisos</h2><span class="badge">${permissions.length} disponibles</span></div><p class="help spacer">Cada casilla otorga solo el permiso indicado. No se añaden otros permisos automáticamente.</p>${[...new Set(permissions.map(p=>p[2]))].map(group=>`<fieldset class="permissiongroup"${state==='validation'&&!keys.size?' tabindex="-1" aria-invalid="true" aria-describedby="permissions-error"':''}${disabled(off)}><legend>${group}</legend><div class="permissionchoices">${permissions.filter(p=>p[2]===group).map(p=>`<label class="checkline" for="perm-${p[0]}"><input id="perm-${p[0]}" name="permission" type="checkbox" value="${p[0]}"${keys.has(p[0])?' checked':''}><span><strong>${p[1]}</strong><small>${p[3]}</small></span></label>`).join('')}</div></fieldset>`).join('')}${state==='validation'?'<p class="field-error" id="permissions-error">Selecciona al menos un permiso. Completa también el nombre del rol.</p>':''}</section><aside class="card pad summarybox"><div class="eyebrow">Resumen de acceso</div><h2 class="spacer" id="role-summary-name">${escapeHTML(fixed?role.name:draft.roleName||'Nuevo rol')}</h2><div id="perm-summary">${permissionSummary(keys)}</div><hr class="divider"><p class="help">${fixed?'Rol del sistema.':roleMode==='new'?'Aún no hay cuentas con este rol.':state==='stale'?'Cuentas asignadas: no disponible.':`${assigned} cuentas asignadas. Los cambios aplican en su próxima solicitud.`}</p>${fixed||roleMode==='new'?'':`<section class="dangerzone spacer"><h2>Eliminar rol</h2><p class="help spacer">${assigned>0?`Este rol está asignado a ${assigned} cuentas. Asígnales otro rol antes de eliminarlo.`:'El diálogo de muestra representa un rol sin cuentas asignadas.'}</p><div class="spacer">${button('Eliminar rol','delete_role','danger',blocked()||assigned>0)}</div></section>`}</aside></div>${fixed?'':`<div class="inlineactions spacer">${link('Cancelar','roles')}</div>${state==='disabled'?'<p class="help">Completa el nombre y selecciona al menos un permiso antes de guardar.</p>':''}`}</form>`;}
function deniedView(){return shell(authFrame(`<h1 tabindex="-1">No tienes acceso a esta sección</h1><p class="muted">Tu rol actual no incluye este permiso. Consulta con tu administrador si necesitas acceso.</p><div class="inlineactions">${button('Volver al inicio','home','primary')}${button('Cerrar sesión','logout')}</div>`),false);}
function render(focus=true){syncTools();if(view==='denied'||state==='denied'||['accounts','invite','account'].includes(view)&&!['admin','accounts'].includes(menuAccess)||['roles','role'].includes(view)&&!['admin','roles'].includes(menuAccess)){app.innerHTML=deniedView();}else if(view==='profile'){app.innerHTML=ownAccountView();}else if(view==='notice'){app.innerHTML=updatedNoticeView();}else if(['login','activate','reset'].includes(view)){app.innerHTML=authView();}else{app.innerHTML=shell(state==='loading'?loading():({accounts:accountsView,invite:inviteView,account:accountView,roles:rolesView,role:roleView}[view])());}if(focus)app.querySelector('h1')?.focus({preventScroll:true});announce(`${views[view]}. Estado: ${stateNames[state]}.`);}
function syncTools(){document.getElementById('view').innerHTML=Object.entries(views).map(([id,label])=>`<option value="${id}"${id===view?' selected':''}>${label}</option>`).join('');document.getElementById('state').innerHTML=states[view].map(s=>`<option value="${s}"${s===state?' selected':''}>${stateNames[s]}</option>`).join('');const scenes=view==='account'?[...['change_role',currentAccount().status==='inactive'?'reactivate':'deactivate','delete_account'],currentAccount().status==='invited'?'replace_invite':'reset_link']:view==='role'?['edit_role','delete_role']:[];const labels={change_role:'Cambiar rol',deactivate:'Desactivar cuenta',reactivate:'Reactivar cuenta',delete_account:'Eliminar cuenta',reset_link:'Crear enlace de restablecimiento',replace_invite:'Generar enlace nuevo',edit_role:'Guardar cambios del rol',delete_role:'Eliminar rol'};document.getElementById('scene').innerHTML='<option value="">Sin diálogo</option>'+scenes.map(s=>`<option value="${s}">${labels[s]}</option>`).join('');document.getElementById('scene').disabled=!scenes.length;document.getElementById('menu-state').value=menuState;document.getElementById('menu-state').disabled=['login','activate','reset'].includes(view);document.getElementById('notice-language').value=noticeLang;document.querySelector('.mocknote').textContent='Personas y enlaces ficticios. Las acciones solo simulan resultados; no se envía ni guarda información.';}
function go(to,newState='ready'){submissionVersion++;if(dialog.open)dialog.close();view=to;state=newState;if(to==='login')activatedPerson=null;draft.password='';draft.current='';draft.confirm='';draft.accepted=false;menuState='closed';if(to==='account')desiredRole=currentAccount().role;resetCreated=false;inviteRegenerated=false;lastAction='';render();window.scrollTo({top:0});}
function dialogDescription(){const a=currentAccount();return {change_role:['Cambiar rol',`Asignarás ${roleById(desiredRole).name} a ${a.email}. El acceso cambia en su próxima solicitud. Si pierdes permisos de administración, no podrás volver a esta sección.`,'Guardar rol'],deactivate:['Desactivar cuenta',`${a.email} perderá el acceso y sus sesiones terminarán en su próxima solicitud. Sus datos se conservan.`,'Desactivar cuenta'],reactivate:['Reactivar cuenta',`${a.email} podrá volver a iniciar sesión con su rol asignado.`,'Reactivar cuenta'],delete_account:['Eliminar cuenta',`Eliminarás la cuenta ${a.email} y sus datos personales de acceso. Se eliminarán la cuenta y sus datos personales. El gasto de IA se conservará sin datos personales como Cuenta eliminada. Esta acción no se puede deshacer. La muestra no tiene trabajo guardado.`,'Eliminar cuenta'],reset_link:['Crear enlace de restablecimiento',`Crearás un enlace para ${a.email}, válido por 24 horas. Al cambiar la contraseña se cerrarán todas sus sesiones. Los enlaces de restablecimiento anteriores sin usar dejarán de funcionar. Debes compartir el enlace directamente.`,'Crear enlace'],replace_invite:['Generar enlace nuevo',`Crearás una nueva invitación para ${a.email}, válida por 7 días. Todos sus enlaces de invitación anteriores sin usar dejarán de funcionar. Compártela directamente; no se enviará un correo.`,'Generar enlace nuevo'],edit_role:['Guardar cambios del rol',`Los nuevos permisos se aplicarán en la próxima solicitud de las ${state==='role_in_use'?2:roleById(selectedRole).assigned} cuentas asignadas a este rol. Revisa el resumen antes de guardar.`,'Guardar cambios'],delete_role:['Eliminar rol',`Eliminarás el rol ${draft.roleName}. La simulación corresponde a un rol sin cuentas asignadas.`,'Eliminar rol']}[dialogKind];}
function openDialog(kind,trigger){if(kind==='replace_invite'&&currentAccount().status!=='invited'||kind==='reset_link'&&currentAccount().status==='invited'){toast('Usa la operación correspondiente al estado de esta cuenta.');document.getElementById('scene').value='';return;}if(kind==='delete_account'&&['has_work','eligibility_unknown'].includes(state)){toast('No se puede eliminar sin confirmar que no tiene trabajo guardado.');document.getElementById('scene').value='';return;}if(blocked()||state==='fixed'&&['delete_role','edit_role'].includes(kind)||view==='account'&&(state==='last_admin'||isLastAdmin())&&['change_role','deactivate','delete_account'].includes(kind)){toast('Esta operación está deshabilitada en el estado seleccionado.');document.getElementById('scene').value='';return;}if((state==='role_in_use'||roleById(selectedRole).assigned>0)&&kind==='delete_role'){toast('Asigna otro rol a las cuentas antes de eliminarlo.');return;}dialogKind=kind;dialogPhase='confirm';dialogTrigger=trigger;renderDialog();dialog.showModal();dialog.querySelector('[data-action="cancel-dialog"]').focus();}
function renderDialog(){dialog.setAttribute('aria-labelledby','dialogtitle');dialog.setAttribute('aria-describedby','dialogdescription');const [heading,description,confirm]=dialogDescription(),pending=dialogPhase==='pending',deleting=dialogKind==='delete_account';dialog.innerHTML=`<div class="modaltools"><label for="dialog-phase">Estado del diálogo · control del mockup<select id="dialog-phase"><option value="confirm"${dialogPhase==='confirm'?' selected':''}>Confirmación</option><option value="pending"${pending?' selected':''}>Enviando</option><option value="error"${dialogPhase==='error'?' selected':''}>Error</option></select></label></div><div class="dialogbody stack" aria-busy="${pending}"><h2 id="dialogtitle">${heading}</h2><p id="dialogdescription" class="muted wrap">${escapeHTML(description)}</p>${dialogPhase==='error'?'<div class="banner error" role="alert">No se pudo completar la operación. La cuenta o el rol no se modificó. Puedes reintentar.</div>':''}${deleting?`<div class="field"><label for="delete-confirm">Escribe el correo para confirmar</label><input id="delete-confirm" autocomplete="off" type="email" aria-describedby="delete-help"${disabled(pending)}><p class="help wrap" id="delete-help">${escapeHTML(currentAccount().email)}</p></div>`:''}${pending?'<p class="pendinglabel" role="status">Enviando… Espera el resultado antes de cerrar.</p>':''}</div><div class="dialogfooter">${button('Cancelar','cancel-dialog','',pending)}${button(pending?'Enviando…':confirm,'confirm-dialog',['deactivate','delete_account','delete_role'].includes(dialogKind)?'danger':'primary',pending||deleting)}</div>`;}
function closeDialog(){if(dialogPhase==='pending')return;dialog.close();document.getElementById('scene').value='';if(dialogTrigger?.isConnected)dialogTrigger.focus();else document.getElementById('scene').focus();}
function completeDialog(){const a=currentAccount();if(dialogKind==='change_role'){roleById(a.role).assigned=Math.max(0,roleById(a.role).assigned-1);roleById(desiredRole).assigned++;a.role=desiredRole;lastAction='Rol actualizado. El cambio se aplicará en la próxima solicitud.';}if(dialogKind==='deactivate'){a.status='inactive';lastAction='Cuenta desactivada. El acceso termina en su próxima solicitud.';}if(dialogKind==='reactivate'){a.status='active';lastAction='Cuenta reactivada. Ya puede iniciar sesión.';}if(dialogKind==='reset_link'){resetGeneration++;resetCreated=true;lastAction='Enlace de restablecimiento creado. Los anteriores sin usar ya no funcionan.';}if(dialogKind==='replace_invite'){invitationGeneration++;inviteRegenerated=true;selectedAccount=a.id;lastAction='Invitación reemplazada. Los enlaces anteriores sin usar ya no funcionan.';}if(dialogKind==='edit_role'){const editing=roleById(selectedRole);editing.name=draft.roleName;editing.count=selectedPermissions.size;editing.perms=[...selectedPermissions];}dialogPhase='confirm';dialog.close();document.getElementById('scene').value='';if(dialogKind==='delete_account'){roleById(a.role).assigned=Math.max(0,roleById(a.role).assigned-1);accounts=accounts.filter(x=>x.id!==a.id);view='accounts';state='ready';}else if(dialogKind==='delete_role'){const index=roles.findIndex(r=>r.id===selectedRole);if(index>=5)roles.splice(index,1);view='roles';state=roles.length>5?'ready':'empty';}else{state='success';}render();toast('Resultado simulado. No se modificaron datos reales.');}
async function copyLink(id){const el=document.getElementById(id);try{if(!navigator.clipboard?.writeText)throw new Error('clipboard unavailable');await navigator.clipboard.writeText(el.textContent);toast('Enlace copiado.');}catch{const selection=window.getSelection();const range=document.createRange();range.selectNodeContents(el);selection.removeAllRanges();selection.addRange(range);el.focus();toast('No se pudo copiar automáticamente. El enlace está seleccionado: cópialo manualmente.');}}
document.getElementById('view').addEventListener('change',e=>go(e.target.value));
document.getElementById('state').addEventListener('change',e=>{submissionVersion++;state=e.target.value;if(state==='no_results')search='sin coincidencias';if(state==='ready'){search='';statusFilter='';roleFilter='';}if(state==='invited'){selectedAccount='luis';desiredRole=currentAccount().role;}if(state==='last_admin')selectedAccount='admin';if(state==='fixed'&&selectedRole==='custom')selectedRole='p2';if(view==='role'&&state!=='fixed'&&roles.slice(0,5).some(r=>r.id===selectedRole)){selectedRole='custom';roleMode='edit';draft.roleName=roleById(selectedRole).name;selectedPermissions=new Set(roleById(selectedRole).perms);}if(state==='conflict'&&view==='notice')draft.accepted=false;if(state==='validation'){if(['login','activate','reset','invite','profile'].includes(view)){draft.email='';draft.password='';draft.confirm='';draft.current='';draft.name='';draft.inviteRole='';draft.accepted=false;}if(view==='notice')draft.accepted=false;if(view==='role'){draft.roleName='';selectedPermissions=new Set();}}render(false);if(state==='current_incorrect')document.getElementById('current')?.focus();});
document.getElementById('menu-state').addEventListener('change',e=>{menuState=e.target.value;const menu=document.getElementById('account-menu');if(menu)menu.open=menuState==='open';});
document.getElementById('menu-access').addEventListener('change',e=>{menuAccess=e.target.value;activatedPerson=null;render(false);});
document.addEventListener('toggle',e=>{if(e.target.id==='account-menu'){menuState=e.target.open?'open':'closed';document.getElementById('menu-state').value=menuState;}},true);
document.addEventListener('keydown',e=>{const menu=document.getElementById('account-menu');if(e.key==='Escape'&&menu?.open&&!dialog.open){e.preventDefault();menu.open=false;menu.querySelector('summary').focus();}});
document.addEventListener('click',e=>{const menu=document.getElementById('account-menu');if(menu?.open&&!menu.contains(e.target)&&e.target.id!=='menu-state'){menu.open=false;}});
document.getElementById('theme').addEventListener('change',e=>{document.documentElement.dataset.theme=e.target.value;render(false);});
document.getElementById('scene').addEventListener('change',e=>{if(e.target.value)openDialog(e.target.value,e.target);});
dialog.addEventListener('cancel',e=>{e.preventDefault();closeDialog();});
dialog.addEventListener('change',e=>{if(e.target.id==='dialog-phase'){dialogPhase=e.target.value;renderDialog();dialog.querySelector('#dialog-phase').focus();}});
dialog.addEventListener('input',e=>{if(e.target.id==='delete-confirm')dialog.querySelector('[data-action="confirm-dialog"]').disabled=e.target.value!==currentAccount().email||dialogPhase==='pending';});
document.addEventListener('input',e=>{const el=e.target;if(['email','current','password','confirm','name','company','roleName'].includes(el.id)){draft[el.id]=el.value;if(el.id==='roleName')document.getElementById('role-summary-name').textContent=el.value||'Nuevo rol';}if(el.id==='search'){search=el.value;if(state==='no_results')state='ready';document.getElementById('account-results').innerHTML=accountListings();}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='accept')draft.accepted=el.checked;if(el.id==='invite-role'){draft.inviteRole=el.value;document.getElementById('invite-access').innerHTML=accessSummary(el.value);document.getElementById('invite-role-title').textContent=el.value?roleById(el.value).name:'Sin rol seleccionado';}if(el.id==='account-role'){desiredRole=el.value;document.getElementById('account-access').innerHTML=accessSummary(el.value);document.querySelector('#account-form [type=submit]').disabled=blocked()||isLastAdmin()||desiredRole===currentAccount().role;document.getElementById('account-role-help').textContent=desiredRole===currentAccount().role?'No hay cambios de rol pendientes. Guarda cuando selecciones otro rol.':'Revisa los permisos del nuevo rol antes de guardar.';}if(el.name==='permission'){if(el.checked)selectedPermissions.add(el.value);else selectedPermissions.delete(el.value);document.getElementById('perm-summary').innerHTML=permissionSummary(selectedPermissions);announce(`${selectedPermissions.size} permisos seleccionados.`);}if(el.id==='notice-language'){noticeLang=el.value;render(false);}if(el.id==='status-filter'||el.id==='role-filter'){statusFilter=document.getElementById('status-filter').value;roleFilter=document.getElementById('role-filter').value;document.getElementById('account-results').innerHTML=accountListings();}});
document.addEventListener('click',e=>{const nav=e.target.closest('[data-go]');if(nav){e.preventDefault();go(nav.dataset.go);return;}const target=e.target.closest('[data-action]');if(!target||target.disabled)return;const action=target.dataset.action;if(target.tagName==='A')e.preventDefault();
 if(action==='theme'){const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;document.getElementById('theme').value=theme;render(false);}
 else if(action==='password'){const input=document.getElementById(target.dataset.for),show=input.type==='password';input.type=show?'text':'password';target.textContent=show?'Ocultar':'Mostrar';target.setAttribute('aria-pressed',String(show));target.setAttribute('aria-label',`${show?'Ocultar':'Mostrar'} contraseña`);}
 else if(action==='logout'){go('login','session_expired');}
 else if(action==='home'){if(noToolAccess())go('profile');else toast('Destino simulado: Taller 3D, la primera herramienta permitida para este rol. La herramienta queda fuera de SP-2.');}
 else if(action==='retry'){state='ready';render();}else if(action==='reload-notice'){draft.accepted=false;state='ready';render();}
 else if(action==='clear-filters'){search='';statusFilter='';roleFilter='';state='ready';render();}
 else if(action==='open-account'){selectedAccount=target.dataset.id;desiredRole=currentAccount().role;go('account');}
 else if(action==='new-role'){roleMode='new';selectedRole='custom';draft.roleName='';selectedPermissions=new Set();go('role');}
 else if(action==='open-system'){selectedRole=target.dataset.id;roleMode='system';go('role','fixed');}
 else if(action==='edit-custom'){roleMode='edit';selectedRole=target.dataset.id||roles[5].id;draft.roleName=roleById(selectedRole).name;selectedPermissions=new Set(roleById(selectedRole).perms);go('role');}
 else if(['change_role','deactivate','reactivate','delete_account','reset_link','replace_invite','edit_role','delete_role'].includes(action))openDialog(action,target);
 else if(action==='cancel-dialog')closeDialog();else if(action==='confirm-dialog')completeDialog();else if(action==='copy-invite')copyLink('invite-link');else if(action==='copy-reset')copyLink('reset-link');else if(action==='copy-renewed-invite')copyLink('renewed-invite-link');
});
document.addEventListener('submit',e=>{e.preventDefault();if(blocked())return;const form=e.target;let valid=form.checkValidity();for(const input of form.querySelectorAll('input[required]:not([type=checkbox])'))if(!input.value.trim())valid=false;if(['password-form','own-password-form'].includes(form.id))valid=valid&&draft.password===draft.confirm;if(form.id==='role-form')valid=valid&&selectedPermissions.size>0;if(!valid){state='validation';render(false);const first=app.querySelector('[aria-invalid="true"]');first?.focus();announce('Revisa los campos señalados antes de continuar.');return;}if(form.id==='invite-form'&&accounts.some(a=>a.email.toLowerCase()===draft.email.trim().toLowerCase())){state='conflict';render();return;}if(form.id==='account-form'){if(desiredRole===currentAccount().role)return;openDialog('change_role',form.querySelector('[type=submit]'));return;}if(form.id==='role-form'&&roleMode!=='new'){openDialog('edit_role',document.querySelector('[form="role-form"]'));return;}state='pending';const requestVersion=++submissionVersion;render(false);setTimeout(()=>{if(state!=='pending'||requestVersion!==submissionVersion)return;if(view==='invite'){accounts.push({id:'invited-'+accounts.length,name:draft.name,email:draft.email,company:draft.company||'No indicada',role:draft.inviteRole,status:'invited',last:'Aún no ha ingresado',invited:'26 oct 2026, 15:40',activated:'Pendiente',notice:'Aún no ha aceptado'});roleById(draft.inviteRole).assigned++;}if(view==='role'&&roleMode==='new'){const created={id:'custom-'+roles.length,name:draft.roleName,count:selectedPermissions.size,assigned:0,perms:[...selectedPermissions]};roles.push(created);selectedRole=created.id;roleMode='edit';}if(view==='activate')activatedPerson={name:'Ana Martínez',email:'ana.martinez@example.com',role:'p3'};state='success';draft.password='';draft.current='';draft.confirm='';render();toast('Resultado simulado. No se envió información.');},650);});
render(false);
</script>
