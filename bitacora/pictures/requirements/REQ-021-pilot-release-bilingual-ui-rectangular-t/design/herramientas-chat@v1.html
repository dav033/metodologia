:root{--background:var(--fondo);--foreground:var(--texto);--card:var(--superficie);--card-foreground:var(--texto);--popover:var(--superficie);--popover-foreground:var(--texto);--primary:var(--acento);--primary-hover:var(--acento-hover);--primary-foreground:var(--sobre-acento);--secondary:var(--superficie-2);--secondary-foreground:var(--texto);--muted:var(--superficie-2);--muted-foreground:var(--texto-suave);--accent:var(--superficie-2);--accent-foreground:var(--texto);--destructive:var(--error);--destructive-hover:var(--error);--destructive-foreground:#ffffff;--destructive-soft:var(--error-suave);--success:var(--exito);--success-soft:var(--exito-suave);--warning:var(--aviso);--warning-soft:var(--aviso-suave);--info:var(--acento);--info-soft:var(--fondo);--primary-soft:var(--fondo);--input:var(--texto-tenue);--border:var(--borde);--ring:var(--acento);--sidebar:var(--superficie);--sidebar-foreground:var(--texto);--sidebar-accent:var(--superficie-2);--sidebar-accent-foreground:var(--texto);--sidebar-primary:var(--acento);--sidebar-primary-foreground:var(--sobre-acento);--sidebar-ring:var(--acento);--sidebar-border:var(--borde);--chart-1:var(--acento);--chart-2:var(--exito);--chart-3:var(--aviso);--chart-4:var(--error);--chart-5:var(--texto-suave);--radius:18px;--radius-panel:32px;--radius-inset:24px;--radius-field:18px;--radius-pill:999px;--font-sans:Geist,system-ui,sans-serif}

*{box-sizing:border-box}body{margin:0;background:var(--fondo);color:var(--texto);font:15px/1.5 Geist,system-ui,sans-serif}h1,h2,h3,p{margin:0}details:not([open])>:not(summary){display:none}button,input,select{font:inherit}a,button,summary{-webkit-tap-highlight-color:transparent}a{color:var(--acento);text-underline-offset:4px}button{cursor:pointer}svg{width:18px;height:18px;flex-shrink:0}button,input,select{max-width:100%}h1,h2,h3,p,button,a,summary{overflow-wrap:anywhere}small,.muted{color:var(--texto-suave)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
