<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup · Órbita de montaje · 1</title><style>:root{--paper:#f3f7f5;--ink:#253b35;--bg:#e1ebe7}body{margin:0;padding:24px;background:var(--bg);color:var(--ink);font:16px Arial}body.dark{--paper:#193d36;--ink:#f1faf7;--bg:#0c2822}header,footer{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}button{padding:12px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);cursor:pointer}main{max-width:1100px;margin:30px auto;display:grid;grid-template-columns:1.5fr 1fr;gap:40px}h1{font:italic 76px/0.9 Georgia;margin:12px 0 20px;letter-spacing:-4px}.plane{background:var(--paper);padding:28px;border-radius:60px 8px 8px 8px}.line{display:flex;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--ink)}.go{display:block;width:100%;margin-top:30px;background:#b51c30;color:white}.stamp{font:14px monospace}.stage{position:relative;height:400px;background:#cfebe4;border-radius:50%;margin:25px 80px}.table{position:absolute;width:230px;height:110px;background:#e33745;border:8px double #69101a;border-radius:48%;left:calc(50% - 115px);top:160px;transform:rotate(-18deg);box-shadow:12px 18px 0 #73a99c}.arch{position:absolute;width:150px;height:180px;border:27px solid #fff;outline:2px solid #789b93;border-bottom:0;border-radius:100px 100px 0 0;left:calc(50% - 75px);top:30px}.paddle{position:absolute;background:var(--paper);padding:16px 22px;border:2px solid var(--ink);border-radius:50%;color:var(--ink)}.one{left:-25px;bottom:70px;transform:rotate(-14deg)}.two{top:20px;right:-35px;transform:rotate(12deg)}.three{bottom:-12px;right:80px;transform:rotate(-5deg)} @media(max-width:760px){body{padding:20px}main{grid-template-columns:1fr;gap:10px}h1{font-size:56px}.stage{margin:25px 30px;height:360px}.paddle{font-size:12px;padding:12px}.plane{padding:24px}footer{gap:20px}}</style><header><b>Pictures / Taller 3D</b><button onclick="document.body.classList.toggle('dark')">Tema claro / oscuro</button></header><main><section><span class="stamp">Mockup · MINIATURA 1</span><h1>Dale espacio.</h1><div class="stage"><div class="arch"></div><div class="table"></div><b class="paddle one">Mesas</b><b class="paddle two">Backing</b><b class="paddle three">Salida GLB</b></div></section><section class="plane"><span class="stamp">Aurora · Mesa seleccionada</span><h2>Mesa rectangular</h2><p>La medida hace el montaje.</p><div class="line"><span>Largo</span><b>2,40 m</b></div><div class="line"><span>Fondo × alto</span><b>0,90 × 0,75 m</b></div><div class="line"><span>Sillas colocadas</span><b>8</b></div><button class="go">Ver lista de compras ↗</button></section></main><footer><span>Órbita de montaje · 1</span><span>Composición exploratoria · sin aprobación</span></footer></html>
