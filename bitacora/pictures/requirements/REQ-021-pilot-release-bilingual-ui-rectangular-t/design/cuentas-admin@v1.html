/* ---------- Dialog, Alert Dialog, Sheet ---------- */

/* ---------- Accordion ---------- */

.accordion-trigger { display: flex; align-items: center; justify-content: space-between; gap: calc(var(--spacing) * 4); padding: calc(var(--spacing) * 4) 0; font-size: var(--text-sm); font-weight: 500; cursor: pointer; list-style: none; border-radius: var(--radius-sm); }

/* ---------- Alert ---------- */

function stateBanner(){if(state==='session_expired')return '<div class="alert" role="status">Tu sesión terminó. Inicia sesión para continuar.</div>';if(state==='current_incorrect')return '<div class="alert" data-variant="destructive" role="alert">Revisa tu contraseña actual y vuelve a intentarlo.</div>';if(state==='error')return `<div class="alert" data-variant="destructive" role="alert">${view==='login'?'No pudimos iniciar sesión. Revisa el correo y la contraseña o consulta con tu administrador. Si has tenido varios intentos fallidos, espera 15 minutos antes de volver a intentarlo.':'No pudimos completar la operación. Revisa los datos y vuelve a intentarlo.'} ${button('Reintentar','retry','ghost')}</div>`;
 if(state==='offline')return `<div class="alert" data-variant="warning" role="alert">Sin conexión. Vuelve a conectarte y reintenta. Los cambios no se enviarán automáticamente.${button('Reintentar','retry','ghost')}</div>`;
 if(state==='stale')return `<div class="alert" data-variant="warning" role="status"><strong>Estos datos pueden haber cambiado.</strong><p>No pudimos actualizar. Última actualización: 26 oct 2026, 15:35 (Bogotá). Algunos datos no están disponibles. Actualiza antes de hacer cambios.</p>${button('Actualizar','retry','ghost')}</div>`;
 if(state==='conflict'&&view==='notice')return `<div class="alert" data-variant="warning" role="alert">Hay una versión más reciente del aviso. Cárgala y léela antes de aceptar.${button('Cargar aviso actual','reload-notice','ghost')}</div>`;
 if(state==='conflict')return `<div class="alert" data-variant="warning" role="alert">${view==='invite'?'Ya existe una cuenta con este correo. Busca la cuenta para revisar su estado.':'Otra persona cambió este registro. Actualiza los datos antes de guardar tu propuesta.'}${view==='invite'?link('Volver a cuentas','accounts'):button('Actualizar datos','retry','ghost')}</div>`;
 if(state==='validation')return '<div class="alert" data-variant="destructive" role="alert" id="validation-summary">Revisa los campos señalados antes de continuar.</div>';
 return '';}
function loading(){return `<section class="stack-lg" aria-busy="true"><h1 tabindex="-1">Cargando…</h1><p class="text-muted" role="status">Estamos preparando esta sección.</p><div class="stack" aria-hidden="true"><div class="skeleton" style="width:45%"></div><div class="skeleton" style="height:40px"></div><div class="skeleton" style="height:40px"></div><div class="skeleton" style="width:70%"></div></div></section>`;}
function authFrame(content,wide=false){return `<section id="main" class="auth-layout"><div class="auth-column pictures-auth" data-width="${wide?'notice':'form'}"><div class="auth-brand">${mark}<span>Pictures</span></div><section class="card" aria-busy="${busy()}"><div class="card-content stack-lg">${content}</div></section><footer class="auth-footer stack-sm"><p>Pictures · Piloto · Mockup de planificación · draft</p><div>${button(document.documentElement.dataset.theme==='dark'?'Tema claro':'Tema oscuro','theme','ghost')}</div></footer></div></section>`;}
function authView(){
 if(state==='loading')return shell(authFrame(loading()),false);
 if(view==='activate'||view==='reset'){
  if(['expired','used','invalid'].includes(state)){return shell(authFrame(`<h1 tabindex="-1">Enlace no disponible</h1><p class="text-muted">Este enlace no es válido o ya no está disponible. Pide a tu administrador un nuevo enlace.</p>${link('Ir a iniciar sesión','login','btn primary full')}`),false);}
 }
 if(state==='success'){
  const copy=view==='activate'?['Tu cuenta está activa. Ya iniciaste sesión',`Ya puedes continuar a ${firstDestination()}. ${noToolAccess()?'Tu rol no incluye Taller 3D, chat ni catálogo.':'Esta muestra termina antes de abrir la herramienta.'}`]:view==='reset'?['Contraseña actualizada','Se cerraron las sesiones de esta cuenta. Inicia sesión con tu nueva contraseña.']:['Sesión iniciada',`En el producto continuarías al destino solicitado si está permitido; sin un destino solicitado, ${noToolAccess()?'tu rol no incluye Taller 3D, chat ni catálogo: abres Mi cuenta (/cuenta).':'abres la primera herramienta permitida (Taller 3D, chat, catálogo), o Mi cuenta (/cuenta) si tu rol no incluye ninguna.'}`];
  return shell(authFrame(`<div class="pictures-result" aria-hidden="true">${icons.check}</div><h1 tabindex="-1">${copy[0]}</h1><p class="text-muted">${copy[1]}</p>${view==='login'?button('Continuar','home','primary full'):view==='activate'?button('Continuar','home','primary full'):link('Ir a iniciar sesión','login','btn primary full')}`),false);
 }
 if(view==='login')return shell(authFrame(`<div><h1 tabindex="-1">Iniciar sesión</h1><p class="text-muted">Usa el correo con el que te invitaron.</p></div>${stateBanner()}${lastAction==='logout'?'<div class="alert" role="status">Tu sesión terminó. Inicia sesión para continuar.</div>':''}<form class="stack" id="login-form" novalidate>${field('email','Correo','email',draft.email,'Por ejemplo, ana.martinez@example.com')}${field('password','Contraseña','password',draft.password)}<button class="button" data-width="full" type="submit"${disabled(blocked())}>${state==='pending'?'Ingresando…':'Entrar'}</button>${state==='disabled'?'<p class="field-description">Completa el correo y la contraseña para continuar.</p>':''}</form><p class="text-sm text-muted">El acceso es por invitación. Si aún no tienes una, consulta con tu administrador.</p>`),false);
 const activation=view==='activate';
 const notice=noticeContent(1);
 return shell(authFrame(`<div><h1 tabindex="-1">${activation?'Activa tu cuenta':'Restablecer contraseña'}</h1><p class="text-muted">${activation?'Crea una contraseña y revisa el aviso de datos.':'Elige una nueva contraseña para tu cuenta.'}</p><div class="stack-sm"><strong class="wrap">Ana Martínez</strong><p class="text-sm wrap">ana.martinez@example.com</p>${activation?`<span class="badge" data-variant="secondary">${activationRoleLabel()}</span>`:'<p class="text-sm text-muted">Enlace válido hasta el 27 oct 2026, 15:40 (Bogotá).</p>'}</div></div>${stateBanner()}${activation?'<p class="text-sm text-muted">Simulación de un enlace válido. El aviso v1 ya fue aprobado por el propietario; faltan datos legales y revisión de Sempertex antes de invitar personas reales.</p>':''}<form class="stack" id="password-form" novalidate>${field('password','Nueva contraseña','password',draft.password,'Entre 8 y 200 caracteres. Puedes pegar una contraseña de tu gestor.')}${field('confirm','Confirma la contraseña','password',draft.confirm)}${activation?notice:''}${activation?`<label class="choice" for="accept"><input class="checkbox" id="accept" name="accept" type="checkbox" required${draft.accepted?' checked':''}${disabled(busy()||state==='notice_pending')}${state==='validation'&&!draft.accepted?' aria-invalid="true" aria-describedby="accept-error"':''}><span>He leído el aviso y autorizo el tratamiento descrito.</span></label>${state==='validation'&&!draft.accepted?'<p class="field-error" id="accept-error">Debes aceptar el aviso para activar tu cuenta.</p>':''}`:''}${state==='notice_pending'?'<p class="text-muted">La activación está deshabilitada mientras se completan los datos legales y su revisión.</p>':''}<button type="submit" class="button" data-width="full"${disabled(blocked())}>${state==='pending'?(activation?'Activando…':'Guardando…'):(activation?'Activar cuenta':'Guardar contraseña')}</button>${state==='disabled'?'<p class="field-description">Completa los campos y las confirmaciones para continuar.</p>':''}</form>${link('Volver a iniciar sesión','login','btn ghost full')}`,activation),false);
}
function noticeContent(version){return `<section class="stack-lg"><div class="row spread"><h2>${noticeLang==='en'?'Personal data notice':'Aviso de tratamiento de datos'}</h2><span class="badge" data-variant="secondary">Versión ${version}${version===2?' · muestra de actualización':''}</span></div><div class="alert" data-variant="warning"><strong>Aviso v1 aprobado por el propietario.</strong><p class="text-sm">Datos legales y revisión de Sempertex pendientes antes de invitar personas reales. ${version===2?'La versión 2 es una muestra: conserva el texto v1 sin inventar contenido legal.':'Los campos entre corchetes están pendientes.'}</p></div><p class="legal wrap" lang="${noticeLang}">${noticeLang==='en'?noticeEN:noticeES}</p></section>`;}
function ownAccountView(){const person=sessionAccount();if(state==='success')return shell(`<section id="main" class="page" data-width="narrow"><section class="stack-lg"><div class="pictures-result" aria-hidden="true">${icons.check}</div><h1 tabindex="-1">Contraseña actualizada</h1><p role="status">Se cerraron tus otras sesiones. Sigues conectado en este navegador.</p><p class="text-muted wrap">${escapeHTML(person.email)}</p>${button('Volver al inicio','home','primary')}${link('Volver a Mi cuenta','profile','btn ghost')}</section></section>`,false);return shell(`<section id="main" class="page" data-width="narrow">${state==='loading'?loading():`<section class="stack-lg"><div><h1 tabindex="-1">Mi cuenta</h1><p class="text-muted">Administra tu contraseña de Pictures.</p></div>${stateBanner()}<div class="stack-sm"><strong>${escapeHTML(person.name)}</strong><p class="text-sm wrap">${escapeHTML(person.email)}</p><span class="badge" data-variant="secondary">${({accounts:'Gestión de cuentas',roles:'Gestión de roles'})[menuAccess]||roleById(person.role).name}</span></div><form class="stack" id="own-password-form" novalidate aria-busy="${busy()}"><h2>Cambiar contraseña</h2>${field('current','Contraseña actual','password',draft.current,'Escribe la contraseña con la que inicias sesión.')}${field('password','Nueva contraseña','password',draft.password,'Entre 8 y 200 caracteres. Puedes pegar una contraseña de tu gestor.')}${field('confirm','Confirma la nueva contraseña','password',draft.confirm)}<p class="field-description">Al cambiarla, se cerrarán tus otras sesiones. Seguirás conectado en este navegador.</p><button type="submit" class="button" data-width="full"${disabled(blocked())}>${state==='pending'?'Cambiando contraseña…':'Cambiar contraseña'}</button>${state==='disabled'?'<p class="field-description">Completa la contraseña actual, la nueva y su confirmación para continuar.</p>':''}</form>${button('Volver al inicio','home','ghost')}</section>`}</section>`,false);}
function updatedNoticeView(){if(state==='loading')return shell(authFrame(loading(),true),false);if(state==='success')return shell(authFrame(`<div class="pictures-result" aria-hidden="true">${icons.check}</div><h1 tabindex="-1">Aviso aceptado</h1><p role="status">Registramos la versión actual y la fecha de tu aceptación.</p><p class="text-muted">En el producto volverías a la página solicitada si tu rol permite abrirla; si no, a Taller 3D, chat o catálogo según tus permisos, o a Mi cuenta (/cuenta) cuando tu rol no incluya ninguna de esas herramientas.</p>${button('Continuar','home','primary full')}`,true),false);return shell(authFrame(`<div><h1 tabindex="-1">Revisa el aviso actualizado</h1><p class="text-muted">Actualizamos el aviso de tratamiento de datos. Léelo y acepta la versión actual para continuar.</p><p class="text-sm wrap">${escapeHTML(sessionAccount().name)} · ${escapeHTML(sessionAccount().email)}</p></div>${stateBanner()}<form class="stack" id="notice-form" novalidate aria-busy="${busy()}">${noticeContent(2)}<label class="choice" for="accept"><input class="checkbox" id="accept" name="accept" type="checkbox" required${draft.accepted?' checked':''}${disabled(blocked())}${state==='validation'&&!draft.accepted?' aria-invalid="true" aria-describedby="accept-error"':''}><span>He leído el aviso y autorizo el tratamiento descrito.</span></label>${state==='validation'&&!draft.accepted?'<p id="accept-error" class="field-error">Acepta la versión actual para continuar o cierra sesión.</p>':''}<button type="submit" class="button" data-width="full"${disabled(blocked())}>${state==='pending'?'Aceptando…':'Aceptar y continuar'}</button>${state==='disabled'?'<p class="field-description">Lee el aviso y marca la aceptación antes de continuar.</p>':''}${state==='notice_pending'?'<p class="field-description">La aceptación espera los datos legales y la revisión de Sempertex.</p>':''}</form>${button('Cerrar sesión','logout','ghost full')}`,true),false);}
function accessSummary(id){if(!id)return '<p class="text-muted">Elige un rol para revisar las herramientas que tendrá esta persona.</p>';const role=roleById(id);return `<p class="text-sm text-muted">${role.count} permisos · Un solo rol por cuenta</p><ul class="pictures-access stack-sm">${permissions.filter(p=>role.perms.includes(p[0])).map(p=>`<li>${p[1]}</li>`).join('')}</ul>`;}
function filterAccounts(){if(state==='empty'||state==='no_results')return [];return accounts.filter(a=>(!search||`${a.name} ${a.email}`.toLocaleLowerCase().includes(search.toLocaleLowerCase()))&&(!statusFilter||a.status===statusFilter)&&(!roleFilter||a.role===roleFilter));}
function accountListings(){const rows=filterAccounts();if(!rows.length)return `<section class="empty"><div class="empty-header"><h2 class="empty-title">${state==='empty'?'Aún no hay cuentas':'No hay cuentas con estos filtros'}</h2><p class="empty-description">${state==='empty'?'Invita a una persona y asígnale el acceso que necesita.':'Prueba con otro nombre, correo, estado o rol.'}</p></div><div class="empty-content">${state==='empty'?link('Invitar persona','invite','btn'):button('Limpiar filtros','clear-filters')}</div></section>`;return `<div class="row" data-justify="between"><span class="text-muted tabular">${rows.length} ${rows.length===1?'cuenta':'cuentas'}${search||statusFilter||roleFilter?' con estos filtros':''}</span><span class="text-muted text-xs">Fechas en Bogotá (UTC−5)</span></div><div class="data-table-frame pictures-table"><div class="table-container"><table class="table"><caption class="sr-only">Cuentas del piloto</caption><thead><tr><th>Persona</th><th>Empresa</th><th>Rol o plan</th><th>Estado</th><th data-align="end">Último acceso</th><th aria-label="Acciones"></th></tr></thead><tbody>${rows.map(a=>`<tr><td><div class="stack-sm"><strong>${escapeHTML(a.name)}</strong><span class="text-muted text-xs wrap">${escapeHTML(a.email)}</span></div></td><td>${escapeHTML(a.company)}</td><td>${roleById(a.role).name}</td><td>${badge(a.status)}</td><td data-align="end" class="tabular">${state==='stale'?'No disponible':a.last}</td><td>${button('Ver cuenta','open-account','ghost',false,`data-id="${a.id}" aria-label="Ver cuenta de ${a.name}"`)}</td></tr>`).join('')}</tbody></table></div></div><div class="pictures-compact-list stack">${rows.map(a=>`<article class="card"><div class="card-header"><h2 class="card-title">${a.name}</h2><p class="card-description wrap">${a.email}</p></div><div class="card-content stack"><dl class="pictures-facts"><dt>Empresa</dt><dd>${escapeHTML(a.company)}</dd><dt>Rol o plan</dt><dd>${roleById(a.role).name}</dd><dt>Estado</dt><dd>${badge(a.status)}</dd><dt>Último acceso · Bogotá</dt><dd>${state==='stale'?'No disponible':a.last}</dd></dl>${button('Ver cuenta','open-account','',false,`data-id="${a.id}" aria-label="Ver cuenta de ${a.name}"`)}</div></article>`).join('')}</div>`;}
function accountsView(){return title('Cuentas','Invita personas y administra el acceso a Pictures.',link(icons.plus+'Invitar persona','invite','btn primary'))+stateBanner()+`<section class="grid" aria-label="Buscar y filtrar cuentas"><div class="field"><label class="label" for="search">Buscar nombre o correo</label><input class="input" id="search" type="search" placeholder="Buscar una persona…" value="${escapeHTML(search)}"></div><div class="field"><label class="label" for="status-filter">Estado</label><select class="select" id="status-filter"><option value="">Todos los estados</option>${[['active','Activa'],['invited','Invitada'],['inactive','Desactivada']].map(([v,l])=>`<option value="${v}"${statusFilter===v?' selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label class="label" for="role-filter">Rol o plan</label><select class="select" id="role-filter"><option value="">Todos los roles</option>${roles.map(r=>`<option value="${r.id}"${roleFilter===r.id?' selected':''}>${r.name}</option>`).join('')}</select></div></section><div id="account-results" class="stack">${accountListings()}</div>`;}
function inviteView(){if(state==='success')return `${link(icons.back+'Cuentas','accounts','back')}${title('Invitación creada','Copia el enlace y compártelo directamente con la persona.')}<section class="stack-lg"><div class="row"><div class="pictures-result" aria-hidden="true" style="margin:0">${icons.check}</div><div class="grow"><h2>${escapeHTML(draft.name||'Luis Rojas')}</h2><p class="text-muted wrap">${escapeHTML(draft.email||'luis.rojas@example.com')}</p></div></div><div><span class="badge" data-variant="secondary">${roleById(draft.inviteRole||'p2').name}</span><p class="field-description">Un solo uso · Vence el 2 nov 2026, 15:40 (Bogotá), 7 días después de su creación.</p></div><div class="alert">Compártelo directamente con esta persona. No se envió ningún correo.</div><div id="invite-link" class="pictures-link font-mono" tabindex="0" aria-label="Enlace ficticio de activación, seleccionable">https://pictures.example.invalid/activar/mock-invitation-not-a-real-token</div><div class="row">${button('Copiar enlace','copy-invite','primary')}${link('Volver a cuentas','accounts')}</div><p class="field-description">Si no puedes copiarlo con el botón, selecciona el enlace y cópialo manualmente. Al salir no se vuelve a mostrar este enlace.</p></section>`;
return `${link(icons.back+'Cuentas','accounts','back')}${title('Invitar persona','Primero revisa a quién invitas y qué acceso tendrá.')}${stateBanner()}<form class="stack-lg" id="invite-form" novalidate aria-busy="${busy()}"><div class="pictures-two"><section class="stack-lg">${field('name','Nombre','text',draft.name)}${field('email','Correo','email',draft.email,'El enlace será válido solo para esta cuenta.')}${field('company','Empresa','text',draft.company,'',false)}<div class="field"><label class="label" for="invite-role">Rol o plan</label>${selectRole('invite-role',draft.inviteRole,blocked(),true)}<p class="field-description">Los planes son roles. Esta persona tendrá un único rol.</p>${state==='validation'?'<p class="field-error" id="role-error">Elige el rol de la persona.</p>':''}</div></section><aside class="stack-lg" aria-label="Vista previa de acceso"><div class="font-medium">Acceso que otorgas</div><h2 class="" id="invite-role-title">${draft.inviteRole?roleById(draft.inviteRole).name:'Sin rol seleccionado'}</h2><div id="invite-access">${accessSummary(draft.inviteRole)}</div></aside></div><div class="row"><button type="submit" class="button"${disabled(blocked())}>${state==='pending'?'Creando invitación…':'Crear invitación'}</button>${link('Cancelar','accounts')}</div>${state==='disabled'?'<p class="field-description">Completa nombre, correo y rol para crear la invitación.</p>':''}<p class="field-description">Crearás un enlace de un solo uso válido por 7 días. No se enviará un correo automáticamente.</p></form>`;}
function accountView(){const a=currentAccount(),last=state==='last_admin'||isLastAdmin(),off=blocked()||last;return `${link(icons.back+'Cuentas','accounts','back')}${title(a.name,'Revisa su acceso y el estado de la cuenta.')}${stateBanner()}${state==='success'?`<div class="alert" data-variant="success" role="status">${lastAction||'Rol actualizado. El cambio se aplicará en la próxima solicitud de la cuenta.'}</div>`:''}${last?'<div class="alert" data-variant="warning">Esta cuenta es el último Administrador activo. No puedes cambiar su rol, desactivarla ni eliminarla.</div>':''}<div class="pictures-detail"><aside class="stack-lg"><h2 class="">${a.name}</h2><p class="text-sm text-muted wrap">${a.email}</p><p class="text-sm text-muted">${a.company}</p><div class="">${badge(a.status)}</div><dl class="pictures-facts"><dt>Invitación</dt><dd>${a.invited}</dd><dt>Activación</dt><dd>${a.activated}</dd><dt>Último acceso</dt><dd>${state==='stale'?'No disponible':a.last}</dd><dt>Aviso de datos</dt><dd>${a.notice}</dd></dl><p class="field-description">Fechas en Bogotá (UTC−5).</p></aside><div class="stack"><form id="account-form" class="stack-lg" novalidate aria-busy="${busy()}"><h2>Rol y acceso</h2><p class="text-muted text-sm">Los cambios se aplican en la próxima solicitud, sin volver a iniciar sesión.</p><div class="field"><label class="label" for="account-role">Rol o plan asignado</label>${selectRole('account-role',state==='validation'?'':last?'admin':desiredRole,off,state==='validation')}${state==='validation'?'<p class="field-error" id="role-error">Selecciona el rol de la cuenta.</p>':''}</div><div id="account-access">${accessSummary(last?'admin':desiredRole)}</div><button class="button" type="submit"${disabled(off||desiredRole===a.role)} aria-describedby="account-role-help"> ${state==='pending'?'Guardando…':'Guardar rol'}</button><p class="field-description" id="account-role-help">${desiredRole===a.role||state==='disabled'?'No hay cambios de rol pendientes. Guarda cuando selecciones otro rol.':'Revisa los permisos del nuevo rol antes de guardar.'}</p></form><div class="accessactions"><section class="stack-lg"><h2>Recuperación de acceso</h2>${a.status==='invited'?`<p class="text-muted">Esta persona aún no activó su cuenta. Crea un enlace nuevo de 7 días; los enlaces de invitación anteriores que no se hayan usado dejarán de funcionar.</p>${button('Generar enlace nuevo','replace_invite','',blocked())}`:`<p class="text-muted">Crea un enlace de un solo uso, válido por 24 horas. Todas sus sesiones se cierran cuando la persona cambia su contraseña. Los enlaces de restablecimiento anteriores sin usar dejarán de funcionar.</p>${button('Crear enlace de restablecimiento','reset_link','',blocked())}`}${inviteRegenerated?`<div class="alert" data-variant="success" role="status">Invitación reemplazada. Los enlaces de invitación anteriores sin usar ya no funcionan. Vence el 2 nov 2026, 15:40 (Bogotá).</div><div id="renewed-invite-link" class="pictures-link font-mono" tabindex="0">https://pictures.example.invalid/activar/mock-replaced-invitation-${invitationGeneration}</div>${button('Copiar enlace','copy-renewed-invite')}<p class="field-description">Compártelo directamente. No se envió un correo. Al salir no se vuelve a mostrar.</p>`:''}${resetCreated?`<div class="alert" data-variant="success" role="status">Enlace creado. Vence el 27 oct 2026, 15:40 (Bogotá). No se envió un correo. Copia el enlace ahora: al salir no se vuelve a mostrar.</div><div class="pictures-link font-mono" id="reset-link" tabindex="0">https://pictures.example.invalid/restablecer/mock-reset-not-a-real-token-${resetGeneration}</div>${button('Copiar enlace','copy-reset')}`:''}</section><hr class="separator"><section class="stack-lg"><div class="stack" style="border:0;padding:0"><h2>Estado y eliminación</h2><p class="text-muted">Desactivar corta el acceso y conserva los datos. Las cuentas con proyectos o decoraciones guardados solo se pueden desactivar. Al eliminar la cuenta, el gasto de IA se conserva sin datos personales como Cuenta eliminada.</p></div><div class="row">${a.status==='inactive'?button('Reactivar cuenta','reactivate','',blocked()):button('Desactivar cuenta','deactivate','danger',off)}${button('Eliminar cuenta','delete_account','danger',off||['has_work','eligibility_unknown'].includes(state))}</div>${last?'<p class="field-description">Debe permanecer al menos un Administrador activo.</p>':''}${state==='has_work'?'<div class="alert" data-variant="warning">Esta cuenta tiene trabajo guardado. Puedes desactivarla para conservarlo. No se puede eliminar.</div>':state==='eligibility_unknown'?`<div class="alert" data-variant="warning">No pudimos comprobar si tiene trabajo guardado. Comprueba de nuevo antes de eliminar.${button('Comprobar de nuevo','retry','ghost')}</div>`:'<p class="field-description">Esta vista normal simula una cuenta sin trabajo guardado. El servidor vuelve a comprobarlo antes de eliminarla.</p>'}</section></div></div></div>`;}

document.addEventListener('click',e=>{const nav=e.target.closest('[data-go]');if(nav){e.preventDefault();go(nav.dataset.go);return;}const target=e.target.closest('[data-action]');if(!target||target.disabled)return;const action=target.dataset.action;if(target.tagName==='A')e.preventDefault();
 if(action==='recovery'){const help=document.getElementById('recovery-help');help.hidden=!help.hidden;target.setAttribute('aria-expanded',String(!help.hidden));}
 else if(action==='theme'){const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;document.getElementById('theme').value=theme;render(false);}
 else if(action==='password'){const input=document.getElementById(target.dataset.for),show=input.type==='password';input.type=show?'text':'password';target.textContent=show?'Ocultar':'Mostrar';target.setAttribute('aria-pressed',String(show));target.setAttribute('aria-label',`${show?'Ocultar':'Mostrar'} contraseña`);}
 else if(action==='logout'){go('login','session_expired');}
 else if(action==='home'){if(noToolAccess())go('profile');else toast('Destino simulado: Taller 3D, la primera herramienta permitida para este rol. La herramienta queda fuera de SP-2.');}
 else if(action==='retry'){state='ready';render();}else if(action==='reload-notice'){draft.accepted=false;state='ready';render();}
 else if(action==='clear-filters'){search='';statusFilter='';roleFilter='';state='ready';render();}
 else if(action==='open-account'){selectedAccount=target.dataset.id;desiredRole=currentAccount().role;go('account');}
 else if(action==='new-role'){roleMode='new';selectedRole='custom';draft.roleName='';selectedPermissions=new Set();go('role');}
 else if(action==='open-system'){selectedRole=target.dataset.id;roleMode='system';go('role','fixed');}
 else if(action==='edit-custom'){roleMode='edit';selectedRole=target.dataset.id||roles[5].id;draft.roleName=roleById(selectedRole).name;selectedPermissions=new Set(roleById(selectedRole).perms);go('role');}
 else if(['change_role','deactivate','reactivate','delete_account','reset_link','replace_invite','edit_role','delete_role'].includes(action))openDialog(action,target);
 else if(action==='cancel-dialog')closeDialog();else if(action==='confirm-dialog')completeDialog();else if(action==='copy-invite')copyLink('invite-link');else if(action==='copy-reset')copyLink('reset-link');else if(action==='copy-renewed-invite')copyLink('renewed-invite-link');
});
document.addEventListener('submit',e=>{e.preventDefault();if(blocked())return;const form=e.target;let valid=form.checkValidity();for(const input of form.querySelectorAll('input[required]:not([type=checkbox])'))if(!input.value.trim())valid=false;if(['password-form','own-password-form'].includes(form.id))valid=valid&&draft.password===draft.confirm;if(form.id==='role-form')valid=valid&&selectedPermissions.size>0;if(!valid){state='validation';render(false);const first=app.querySelector('[aria-invalid="true"]');first?.focus();announce('Revisa los campos señalados antes de continuar.');return;}if(form.id==='invite-form'&&accounts.some(a=>a.email.toLowerCase()===draft.email.trim().toLowerCase())){state='conflict';render();return;}if(form.id==='account-form'){if(desiredRole===currentAccount().role)return;openDialog('change_role',form.querySelector('[type=submit]'));return;}if(form.id==='role-form'&&roleMode!=='new'){openDialog('edit_role',document.querySelector('[form="role-form"]'));return;}state='pending';const requestVersion=++submissionVersion;render(false);setTimeout(()=>{if(state!=='pending'||requestVersion!==submissionVersion)return;if(view==='invite'){accounts.push({id:'invited-'+accounts.length,name:draft.name,email:draft.email,company:draft.company||'No indicada',role:draft.inviteRole,status:'invited',last:'Aún no ha ingresado',invited:'26 oct 2026, 15:40',activated:'Pendiente',notice:'Aún no ha aceptado'});roleById(draft.inviteRole).assigned++;}if(view==='role'&&roleMode==='new'){const created={id:'custom-'+roles.length,name:draft.roleName,count:selectedPermissions.size,assigned:0,perms:[...selectedPermissions]};roles.push(created);selectedRole=created.id;roleMode='edit';}if(view==='activate')activatedPerson={name:'Ana Martínez',email:'ana.martinez@example.com',role:'p3'};state='success';draft.password='';draft.current='';draft.confirm='';render();toast('Resultado simulado. No se envió información.');},650);});
render(false);

</script>
</body>
</html>
