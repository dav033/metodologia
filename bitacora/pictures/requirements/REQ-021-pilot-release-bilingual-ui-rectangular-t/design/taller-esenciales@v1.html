/* ---------- Accordion ---------- */

const app = document.getElementById('app');
const purchaseDialog = document.getElementById('purchaseDialog');
const stateLabels = {ready:'Normal',loading:'Cargando',empty:'Vacío',error:'Error',success:'Éxito',validation:'Validación',disabled:'Deshabilitado',partial:'Parcial / pendiente de aplicar','permission-denied':'Acceso denegado',offline:'Sin conexión',pending:'Preparando'};

props.forEach(item => { item.repository='escenografia'; item.semanticGroup=['panel_redondo','media_luna','arcos_chiara'].includes(item.id)?'fondo':'decorado'; });
// Source fixtures: PARTIDA_MESA, LIMITES_MESA and FONDO_DEL_ANCHO (metres here).

const model = {tableType:'rectangular',length:2.4,width:.9,height:.75,requested:8,placed:8,chair:'Tiffany',distribution:'Alrededor',cloth:'Hasta el piso',clothColor:'#e8dcf5',legColor:'#6f6f6f',chairColor:'#d8b25a',query:'',prompt:'Añade una mesa rectangular de 2,40 × 0,90 m con 8 sillas Tiffany.',notice:'',added:[],showTable:true,angle:'Perspectiva',legacy:'editable'};
let lastInvoker = null;
let isRendering = false;
const history = {past:[],future:[]};
const snapshot = () => JSON.parse(JSON.stringify(model));
function remember() { history.past.push(snapshot()); history.future=[]; }
const escapeHTML = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const fmt = value => Number(value).toLocaleString('es-CO',{minimumFractionDigits:2,maximumFractionDigits:2});
const currentView = () => selectors.view.value;
const currentState = () => selectors.state.value;
const notReady = () => ['loading','disabled','permission-denied'].includes(currentState());
const blockedExport = () => ['loading','empty','disabled','partial','pending','permission-denied'].includes(currentState());
const announce = text => { document.getElementById('announcement').textContent=text; };
function setStates(preferred='ready') {
 selectors.state.innerHTML=allowedStates[currentView()].map(state=>`<option value="${state}">${stateLabels[state]}</option>`).join('');
 selectors.state.value=allowedStates[currentView()].includes(preferred)?preferred:'ready';
}
function icon(name) {
 const paths={plus:'<path d="M12 5v14M5 12h14"/>',piece:'<path d="m12 3 9 5v8l-9 5-9-5V8l9-5Zm0 9 9-4M12 12 3 8m9 4v9"/>',ai:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z"/>',undo:'<path d="m8 4-5 5 5 5M3 9h10a7 7 0 0 1 0 14"/>',redo:'<path d="m16 4 5 5-5 5m5-5H11a7 7 0 0 0 0 14"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>',file:'<path d="M14 2H5v20h14V7l-5-5Zm0 0v5h5M8 13h8M8 17h6"/>',image:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="m3 17 5-5 4 4 3-3 6 6"/><circle cx="15" cy="8" r="1.5"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>'};
 return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${paths[name]||paths.file}</svg>`;
}

 'table-wave':'<path d="M22 49V85M78 50V86M127 49V85" stroke="#80718d" stroke-width="5"/><path d="M10 31Q40 12 74 32T142 32L141 58Q108 80 74 58T10 57Z" fill="#ddc9ec" stroke="#a98abd" stroke-width="2"/>',

 hoop:'<ellipse cx="75" cy="87" rx="45" ry="7" fill="#b9a4ff" opacity=".15"/><circle cx="75" cy="43" r="35" fill="none" stroke="#d8b25a" stroke-width="4"/><path d="M51 70L45 87H61M99 70L105 87H89" stroke="#d8b25a" fill="none" stroke-width="3"/>',

 };

}
function sceneArt(empty=false) {
 const angles = model.angle==='Planta'?'translate(0 -20) scale(1 .85)':'translate(0 0)';
 const chairs = Array.from({length:model.placed},(_,i)=>{
 const positions=[[198,270],[228,255],[258,240],[288,225],[238,335],[268,320],[298,305],[328,290]];
 const [x,y]=positions[i%positions.length];
 return `<g transform="translate(${x} ${y})"><path d="M0 0V23M20 -9V14M0 8L20 -2" fill="none" stroke="${escapeHTML(model.chairColor)}" stroke-width="4"/><path d="M-3 7L16 -3L30 6L10 16Z" fill="#e6d3ed"/><path d="M10 16V32M30 6V22" stroke="${escapeHTML(model.chairColor)}" stroke-width="3"/></g>`;
 }).join('');
 const balloons = [[112,190,17],[108,159,15],[125,132,18],[118,110,14],[140,95,19],[162,86,14],[169,110,11],[139,117,12],[104,132,10],[116,215,15],[139,220,13],[97,199,10],[154,91,8]].map(([x,y,r],i)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${['#cbb3e0','#eee3f5','#a788c4','#e9d2de'][i%4]}"/><circle cx="${x-4}" cy="${y-5}" r="${r*.22}" fill="white" opacity=".25"/>`).join('');
 return `<svg class="scene" viewBox="0 0 520 430" role="img" aria-label="${empty?'Escena vacía':`Escena esquemática: ${selectedTable().name.toLowerCase()} de ${fmt(model.length)} por ${fmt(model.width)} metros, ${model.placed} sillas, panel redondo y pedestales`}"><defs><pattern id="floorGrid" width="40" height="24" patternUnits="userSpaceOnUse" patternTransform="skewY(-25)"><path d="M40 0H0V24" fill="none" stroke="var(--muted-foreground)" stroke-width=".5" opacity=".15"/></pattern></defs><ellipse cx="265" cy="311" rx="210" ry="88" fill="var(--accent)"/><path d="M0 210L260 80L520 210V430H0Z" fill="url(#floorGrid)"/>${empty?'':`<g transform="${angles}"><ellipse cx="227" cy="260" rx="122" ry="20" fill="var(--overlay)"/><path d="M115 146L212 96L384 185V273L211 188L115 237Z" fill="var(--accent)" opacity=".5"/><circle cx="210" cy="154" r="75" fill="#eadce9" stroke="#d8b25a" stroke-width="4"/>${balloons}<g><path d="M313 204H350V265Q331 277 313 265Z" fill="#baa0d0"/><ellipse cx="331.5" cy="204" rx="18.5" ry="8" fill="#e7d8f0"/><path d="M354 229H389V273Q371 284 354 273Z" fill="#d0bcdf"/><ellipse cx="371.5" cy="229" rx="17.5" ry="7" fill="#f1e7f7"/></g>${model.showTable?`<ellipse cx="278" cy="314" rx="105" ry="34" fill="var(--overlay)"/>${chairs}${model.tableType!=='rectangular'?art(selectedTable().art).replace('<svg viewBox','<svg x="195" y="215" width="180" height="120" viewBox'):`<path d="M221 271V320M310 227V278M346 268V313M257 313V358" stroke="${escapeHTML(model.legColor)}" stroke-width="6"/><path d="M202 270L306 218L357 257L252 312Z" fill="${escapeHTML(model.clothColor)}" stroke="#a98bbd" stroke-width="2"/><path d="M202 270L252 312L252 334L202 291Z" fill="#bda3d2"/><path d="M252 312L357 257L357 280L252 334Z" fill="#ceb7df"/><path d="M247 248L298 287L312 280L261 241Z" fill="#b18fce"/><path d="M195 274L247 316L363 259" fill="none" stroke="var(--ring)" stroke-width="2" stroke-dasharray="5 4"/><path d="M209 361L363 283" stroke="var(--primary)" stroke-width="1"/><path d="M207 355V367M362 277V289" stroke="var(--primary)"/><text x="300" y="344" font-size="11" fill="var(--primary)" transform="rotate(-26 300 344)">${fmt(model.length)} m</text>`}`:''}</g>`}</svg>`;

// Component compositions: kit card#actions, field#vertical, select#native,
// button#variants, dialog#open, popover#open, alert#variants, empty#no-results.
function button(text,action,{primary=false,disabled=false,attrs='',variant='outline'}={}) {
 return `<button class="button" type="button" ${primary?'':`data-variant="${variant}"`} data-action="${action}" ${disabled?'disabled':''} ${attrs}>${text}</button>`;
}
function alertBox(title,description='',variant='default',action='') {
 return `<div class="alert" ${variant==='default'?'':`data-variant="${variant}"`} role="${variant==='destructive'?'alert':'status'}">${icon(variant==='success'?'piece':'file')}<p class="alert-title">${title}</p>${description?`<p class="alert-description">${description}</p>`:''}${action?`<div class="alert-action">${action}</div>`:''}</div>`;
}
function notice(view=currentView()) {
 const state=currentState();
 if(state==='offline')return alertBox('Sin conexión','La escena ya cargada sigue disponible. Los datos remotos no se actualizarán.','default',button('Reintentar conexión','retry'));
 if(state==='disabled')return alertBox('Acción no disponible',view==='export'?'La escena no está lista. Espera a que termine de cargar.':'Se alcanzó el límite de piezas de esta escena.');
 if(state==='partial')return alertBox(view==='export'?'Revisa las piezas antes de exportar':view==='ai'?'Propuesta pendiente de aplicar':`${model.requested} pedidas · ${model.placed} colocadas`,view==='export'?'Hay una pieza sin resolver. La exportación está bloqueada.':view==='ai'?'Tu escena sigue igual.':`En esta disposición caben 8 sillas (ejemplo). La lista usa las ${model.placed} colocadas.`);
 if(state==='pending')return alertBox(view==='export'?'Preparando GLB…':'La IA está preparando una propuesta…','Conserva esta ventana abierta. No se puede iniciar otra petición.');
 if(state==='success')return alertBox(view==='export'?'Descarga GLB iniciada. (Simulación)':view==='table-editor'?'Mesa actualizada':view==='shopping'?'Lista actualizada':view==='ai'?'Propuesta aplicada':'Pieza añadida a la escena',view==='table-editor'?'La lista refleja las sillas colocadas.':view==='ai'?`1 mesa rectangular · ${model.placed} sillas colocadas.`:'Datos ficticios de este mockup.','success');
 return '';
}
function emptyBox(title,desc,action,label) {return alertBox(title,desc,'default',button(label,action));}
function dataState(view=currentView()) {
 const state=currentState();
 if(state==='loading')return `<div class="stack" aria-busy="true" aria-label="Cargando contenido"><p class="text-muted" role="status">${view==='shopping'?'Actualizando la lista':'Cargando contenido'}… Tu escena sigue aquí.</p><span class="skeleton"></span><span class="skeleton"></span><span class="skeleton"></span></div>`;
 if(state==='error')return alertBox(view==='shopping'?'No pudimos actualizar la lista':view==='export'?'No se pudo exportar el GLB':view==='ai'?'No pudimos preparar la propuesta':'No pudimos cargar las piezas','Tu escena y los últimos cambios válidos siguen aquí.','destructive',button('Reintentar','retry'));
 if(state==='empty')return emptyBox(view==='table-editor'?'Selecciona una mesa':view==='ai'?'¿Qué quieres añadir a tu escena?':view==='shopping'?'Todavía no hay piezas':view==='export'?'La escena necesita una pieza':'No encontramos piezas',['tables','backing'].includes(view)?'Prueba con otro nombre o quita los filtros.':'Añade una pieza para continuar.',['tables','backing'].includes(view)?'clear-search':'go-tables',['tables','backing'].includes(view)?'Limpiar búsqueda':'Añadir mesa');
 return '';
}
function planningContext() {
 const notes={tables:['¿Qué mesa necesita esta escena?','Añade el tipo de mesa y ajusta sus medidas en el inspector.'],'table-editor':['¿Qué medidas y cuántas sillas caben?','Ajusta la mesa y comprueba las cantidades colocadas.'],backing:['¿Qué piezas completan el Backing?','Encuentra aros, paneles y pedestales y añádelos a la escena.'],shopping:['¿Qué piezas tengo que preparar?','Revisa cantidades colocadas y medidas, sin precios de alquiler.'],ai:['¿Cómo añado esta mesa con la IA?','Describe la mesa, revisa la propuesta y aplícala a la escena.'],export:['¿Cómo llevo esta escena a Blender?','Descarga el GLB a escala en metros y ábrelo en Blender.']};
 const [q,j]=notes[currentView()];document.getElementById('proposalTitle').textContent=q;document.getElementById('proposalText').textContent=j;
}
const normalized=text=>text.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function filteredProps(){const words=normalized(model.query).trim().split(/\s+/).filter(Boolean);return props.filter(item=>words.every(word=>normalized('Backing '+item.name+' '+(item.alias||'')+' '+item.desc+' '+(item.semanticGroup==='fondo'?'Fondos y tapetes':'Decorado de pie')).includes(word)));}
function categoryTabs() {
 return `<div class="row-sm" aria-label="Categorías">${button('Mobiliario','go-tables',{variant:'ghost',attrs:`aria-pressed="${currentView()==='tables'}"`})}${button('Backing','go-backing',{variant:'ghost',attrs:`aria-pressed="${currentView()==='backing'}"`})}</div>`;
}
function objectCard(title,description,artType,action,attrs='',primary=false,metadata='') {
 return `<article class="card" data-size="sm" ${metadata}><div class="card-content"><div class="object-art">${art(artType)}</div></div><div class="card-header"><h3 class="card-title">${title}</h3><p class="card-description tabular text-right">${description}</p></div><div class="card-footer">${button(icon('plus')+'Añadir',action,{primary,disabled:notReady(),attrs:`aria-label="Añadir ${title}" ${attrs}`})}</div></article>`;
}
function propCards(){const visible=filteredProps();return visible.length?`<div class="object-grid">${visible.map(item=>objectCard(item.name,item.desc,item.type,'add-prop',`data-id="${item.id}"`,false,`data-display-group="Backing" data-canonical-id="${item.id}" data-repository="${item.repository}" data-semantic-group="${item.semanticGroup}"`)).join('')}</div>`:emptyBox('No encontramos piezas','Prueba otro nombre.','clear-search','Limpiar búsqueda');}
function leftPanel(){
 const backing=currentView()==='backing',view=backing?'backing':'tables';
 const unmatched=!backing&&model.query.trim()&&!normalized(model.query).split(/\s+/).every(w=>'mesa rectangular silla mobiliario a medida redonda cuadrada ovalada coctel media luna serpentina banquete'.includes(w));
 const content=unmatched?emptyBox('No encontramos mesas','Prueba otro nombre.','clear-search','Limpiar búsqueda'):dataState(view);
 const types=[['rectangular',tableSpecs.rectangular],...tableKinds];
 return `<aside class="workshop-pane add-pane" aria-label="Añadir piezas"><div class="stack-lg"><div class="stack-sm"><p class="text-muted text-xs">Fondos y muebles</p><h2>Añadir</h2></div>${categoryTabs()}<div class="field"><label class="label" for="search">Buscar piezas</label><input class="input" id="search" type="search" value="${escapeHTML(model.query)}" placeholder="${backing?'Aro, pedestal, panel…':'Mesa, silla…'}"></div>${notice(view)}${content||(backing?`<div class="row" data-justify="between"><div class="stack-sm"><h3>Backing</h3><p class="text-muted">Aros, pedestales y paneles</p></div><span class="badge" data-variant="secondary">${filteredProps().length} piezas · ejemplo</span></div>${propCards()}<p class="text-muted">Piezas de escenografía · no son productos de la tienda.</p>`:`<p class="text-muted">Elige un tipo. Después ajusta las medidas y las sillas.</p><div class="object-grid">${types.map(([type,spec])=>objectCard(spec.name,`${spec.size.slice(0,2).map(fmt).join(' × ')} m<br>Alto ${fmt(spec.size[2])} m`,spec.art,type==='rectangular'?'add-table':'add-table-kind',`data-table-type="${type}"`,type==='rectangular'&&currentView()==='tables'&&selectors.scene.value==='none')).join('')}</div><p class="text-muted">La mesa y sus sillas se mueven juntas.</p>`)}</div></aside>`;
}
function dimensionField(key,label,min,max){const invalid=currentState()==='validation'&&key==='length';return `<div class="field"><label class="label" for="dim-${key}">${label} (m)</label><input class="input tabular text-right" id="dim-${key}" data-dimension="${key}" ${key==='height'?'aria-label="Alto de la tapa (m)"':''} inputmode="decimal" type="text" value="${invalid?fmt(max+2):fmt(model[key])}" aria-invalid="${invalid}" aria-describedby="${key}-help${invalid?' length-error':''}"><p class="field-description" id="${key}-help">${fmt(min)}–${fmt(max)} m</p>${invalid?`<p class="field-error" id="length-error" role="alert">Introduce un valor entre ${fmt(min)} y ${fmt(max)} m. La escena conserva el último valor válido.</p>`:''}</div>`;}
function selectField(id,label,values,selected){return `<div class="field"><label class="label" for="${id}">${label}</label><span class="select-wrap"><select class="select" id="${id}">${values.map(v=>`<option ${v===selected?'selected':''}>${v}</option>`).join('')}</select></span></div>`;}
function tableEditor(){

      return;
    }
    layer.hidden = true;
  }
  function layerOf(el) { return el.closest('[data-kit-layer]'); }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-kit-open], [data-kit-close], [data-kit-toast], [data-kit-sidebar]');
    if (t && t.hasAttribute('data-kit-open')) {
      var layer = document.getElementById(t.getAttribute('data-kit-open'));
      if (layer && !layer.hidden) close(layer); else open(layer, t);
      var pair = layer && document.querySelector('[data-kit-pair="' + layer.id + '"]');
      if (pair) pair.hidden = layer.hidden;
      ev.preventDefault();
      return;
    }
    if (t && t.hasAttribute('data-kit-close')) { var l = layerOf(t); if (l) close(l); ev.preventDefault(); return; }
    if (t && t.hasAttribute('data-kit-toast')) { toast(t.getAttribute('data-kit-toast')); return; }
    if (t && t.hasAttribute('data-kit-sidebar')) {
      var app = document.querySelector('.app');
      if (app) app.setAttribute('data-sidebar', app.getAttribute('data-sidebar') === 'open' ? 'closed' : 'open');
      return;
    }
    var app2 = document.querySelector('.app[data-sidebar="open"]');
    if (app2 && !ev.target.closest('.sidebar')) app2.setAttribute('data-sidebar', 'closed');
    if (!stack.length) return;
    var top = stack[stack.length - 1].layer;
    if (ev.target === top && top.matches('.dialog-overlay, .sheet-overlay')) { close(top); return; }
    if (!top.contains(ev.target) && !top.matches('.dialog-overlay, .sheet-overlay, .sheet-content')) close(top);
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && stack.length) { close(stack[stack.length - 1].layer); return; }
    var tab = ev.target.closest && ev.target.closest('[role=tab]');
    if (tab && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft')) {
      var tabs = [].slice.call(tab.closest('[role=tablist]').querySelectorAll('[role=tab]:not([disabled])'));
      var next = tabs[(tabs.indexOf(tab) + (ev.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
      select(next); next.focus(); ev.preventDefault();
    }
  });

  function select(tab) {
    var list = tab.closest('[role=tablist]');
    [].forEach.call(list.querySelectorAll('[role=tab]'), function (t) {
      var on = t === tab;
      t.setAttribute('aria-selected', on ? 'true' : 'false');
      t.tabIndex = on ? 0 : -1;
      var panel = t.getAttribute('aria-controls') && document.getElementById(t.getAttribute('aria-controls'));
      if (panel) panel.hidden = !on;
    });
  }
  document.addEventListener('click', function (ev) {
    var tab = ev.target.closest('[role=tab]');
    if (tab && !tab.disabled) select(tab);
  });

  function toast(templateId) {
    var tpl = document.getElementById(templateId);
    if (!tpl) return;
    var host = document.querySelector('.toaster');
    if (!host) { host = document.createElement('section'); host.className = 'toaster'; host.setAttribute('aria-label', 'Notificaciones'); document.body.appendChild(host); }
    host.setAttribute('aria-live', 'polite');
    var node = (tpl.content ? tpl.content.firstElementChild : tpl).cloneNode(true);
    node.hidden = false;
    host.appendChild(node);
    while (host.children.length > 3) host.removeChild(host.firstElementChild);
    var close = node.querySelector('[data-kit-dismiss]');
    if (close) close.addEventListener('click', function () { node.remove(); });
    setTimeout(function () { node.remove(); }, 5000);
  }

  document.addEventListener('input', function (ev) {
    var box = ev.target.closest && ev.target.closest('.combobox');
    if (!box || ev.target.tagName !== 'INPUT') return;
    var q = ev.target.value.trim().toLowerCase(), list = box.querySelector('.listbox'), shown = 0;
    if (!list) return;
    list.hidden = false;
    ev.target.setAttribute('aria-expanded', 'true');
    [].forEach.call(list.querySelectorAll('.listbox-item'), function (item) {
      var hit = !q || item.textContent.toLowerCase().indexOf(q) >= 0;
      item.hidden = !hit; if (hit) shown++;
    });
    var empty = list.querySelector('.listbox-empty');
    if (empty) empty.hidden = shown > 0;
  });

  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.kit !== 'set' || ev.source !== window.parent) return;
    apply('theme', d.theme); apply('motion', d.motion);
  });

  // mockup switcher: [data-show-view|data-show-state|data-hide-state|data-show-scene]="a b" follow the planning selects
  function val(id) { var s = document.getElementById(id); return s && s.tagName === 'SELECT' ? s.value : ''; }
  function inList(list, v) { return (' ' + list + ' ').indexOf(' ' + v + ' ') >= 0; }
  function switcher() {
    var v = val('view'), s = val('state'), c = val('scene');
    root.setAttribute('data-view', v); root.setAttribute('data-mock-state', s); root.setAttribute('data-scene', c);
    [].forEach.call(document.querySelectorAll('[data-show-view], [data-show-state], [data-hide-state], [data-show-scene]'), function (el) {
      var a = el.getAttribute.bind(el);
      el.hidden = !((!el.hasAttribute('data-show-view') || inList(a('data-show-view'), v)) &&
        (!el.hasAttribute('data-show-state') || inList(a('data-show-state'), s)) &&
        (!el.hasAttribute('data-hide-state') || !inList(a('data-hide-state'), s)) &&
        (!el.hasAttribute('data-show-scene') || (c && inList(a('data-show-scene'), c))));
    });
  }
  document.addEventListener('change', function (ev) {
    if (ev.target && /^(view|state|scene)$/.test(ev.target.id)) switcher();
  });

  function start() {
    bindSelect('theme'); bindSelect('motion');
    switcher();
    var q = new URLSearchParams(location.search);
    apply('theme', q.get('theme')); apply('motion', q.get('motion'));
    [].forEach.call(document.querySelectorAll('[role=tablist]'), function (list) {
      var on = list.querySelector('[role=tab][aria-selected="true"]') || list.querySelector('[role=tab]');
      if (on) select(on);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
</body>
</html>
