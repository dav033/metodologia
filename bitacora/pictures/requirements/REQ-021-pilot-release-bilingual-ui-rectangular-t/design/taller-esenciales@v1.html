 const lengthLabel=['redonda','coctel','media_luna'].includes(model.tableType)?'Diámetro':model.tableType==='cuadrada'?'Lado':model.tableType==='u'?'Ancho total':'Largo';
 return `${notice('table-editor')}<div class="section"><h3>Medidas de la mesa</h3><div class="fields">${dimensionField('length',lengthLabel,...spec.ranges[0])}${spec.derived?`<div><small>Ancho derivado</small><p class="mono">${fmt(model.width)} m</p></div>`:dimensionField('width',model.tableType==='u'?'Fondo total':'Ancho',...spec.ranges[1])}<div class="wide">${dimensionField('height','Alto de la tapa',...spec.ranges[2])}</div></div><small>Las medidas se ajustan en pasos de 0,05 m.</small>${currentState()==='validation'?'<button data-action="reset-dimensions">Restablecer valores</button>':''}</div><div class="section"><h3>Sillas</h3><div class="fields seating"><label>Cantidad pedida<input id="chair-count" type="number" min="0" max="40" step="1" value="${requested}" aria-describedby="chair-help"></label><div class="count"><span><small>Colocadas</small><strong>${model.placed}</strong></span><small>Capacidad: 8 · ejemplo</small></div></div><small id="chair-help">${requested} pedidas · ${model.placed} colocadas. La lista recoge las sillas colocadas.</small><div class="fields"><label>Tipo de silla<select id="chair-type">${['Tiffany','Crossback','Ghost','Plegable','Moderna','Banca','Taburete'].map(name=>`<option ${model.chair===name?'selected':''}>${name}</option>`).join('')}</select></label><label>Disposición<select id="chair-layout">${['Alrededor','Un lado','Dos lados (los largos)','Solo cabeceras','Frente al escenario'].map(name=>`<option ${model.distribution===name?'selected':''}>${name}</option>`).join('')}</select></label></div></div><div class="section"><h3>Materiales</h3><label>Mantel<select id="cloth">${['Hasta el piso','Corto','Sin mantel'].map(name=>`<option ${model.cloth===name?'selected':''}>${name}</option>`).join('')}</select></label><div class="swatches"><label><input type="color" value="${model.clothColor}" data-color="clothColor">Mantel / tapa</label><label><input type="color" value="${model.legColor}" data-color="legColor">Patas</label><label><input type="color" value="${model.chairColor}" data-color="chairColor">Sillas</label></div></div><p class="muted">La mesa y las sillas se mueven, giran y duplican juntas.</p><button class="${currentView()==='table-editor'&&selectors.scene.value==='none'?'primary ':''}full" data-action="shopping" ${notReady()?'disabled':''}>Ver lista de compra</button><details><summary class="muted">Conjuntos de versiones anteriores</summary><div class="stack" style="margin-top:10px"><p class="muted" id="legacy-message">${model.legacy==='editable'?'Este conjunto ya es editable.':'Este conjunto tiene sus sillas fijas.'}</p><button data-action="legacy-fixed">Ver ejemplo de conjunto fijo</button><button data-action="convert-legacy">Hacerla editable</button><p class="muted">Las mesas del salón armado se ajustan con la IA: «ajustar el salón».</p></div></details>`;
}
function aiPanel() {
 const state=currentState();
 const blocked=['pending','loading','disabled','offline'].includes(state);
 return `${notice('ai')}${state==='loading'||state==='error'?dataState('ai'):state==='empty'?'<div class="note">Describe qué mesa necesitas. Aún no hay mensajes.</div>':`<div class="chat-line user"><p class="eyebrow">Tu petición</p><p>${escapeHTML(model.prompt)}</p></div>${state==='pending'?'':`<div class="chat-line"><p class="eyebrow">Propuesta de mesa · ejemplo</p><p>Una mesa rectangular de ${fmt(model.length)} × ${fmt(model.width)} m con ${model.placed} sillas Tiffany colocadas.</p><p class="muted">La lista se actualizará con las sillas colocadas.</p>${state==='partial'?`<button class="${selectors.scene.value==='none'?'primary ':''}full" data-action="apply-ai">Aplicar propuesta</button>`:'<button data-action="go-editor" class="full">Editar mesa a mano</button>'}</div>`}`}<label>¿Qué quieres cambiar?<textarea id="prompt" ${blocked?'disabled':''} aria-invalid="${state==='validation'}" aria-describedby="prompt-help">${state==='validation'?'':escapeHTML(model.prompt)}</textarea></label><small id="prompt-help" class="${state==='validation'?'field-error':''}">${state==='validation'?'Escribe qué necesitas antes de enviar.':'Ejemplo: una mesa rectangular con 8 sillas.'}</small><button class="${state==='partial'||selectors.scene.value!=='none'?'':'primary '}full" data-action="send-ai" ${blocked?'disabled':''}>${state==='pending'?'Preparando propuesta…':'Enviar'}</button>${blocked?'<p class="muted">Espera a que termine la petición o se recupere la conexión antes de enviar otra.</p>':''}<p class="muted">Mockup: conversación simulada, sin consumo de IA.</p>`;
}
function exportPanel() {
 const state=currentState();
 return `${notice('export')}${['loading','empty','error'].includes(state)?dataState('export'):''}<div class="file-card"><span class="file-icon" aria-hidden="true">${icon('file')}</span><div><h3>Modelo para Blender</h3><small>Archivo GLB · escala en metros</small></div></div><p class="muted">La escena completa conserva la distribución, las medidas y los colores. Se omiten las ayudas del editor.</p><button class="${selectors.scene.value==='none'?'primary ':''}full" data-action="open-export" ${blockedExport()?'disabled':''}>Abrir opciones de exportación</button>${blockedExport()?'<p class="muted">La descarga estará disponible cuando la escena tenga piezas y esté lista, sin cambios pendientes.</p>':''}<div class="section"><h3>Cómo abrirlo en Blender</h3><p class="muted">Archivo → Importar → glTF 2.0 (.glb/.gltf).</p><p class="muted">Selecciona el archivo de esta escena y comprueba la medida de la mesa.</p></div><div class="note">“Descarga iniciada” confirma el inicio de la descarga. La verificación del modelo en Blender es un paso aparte.</div><small>Mockup: no se genera ningún archivo.</small>`;
}
function inspector() {
 const view=currentView();
 const content=view==='ai'?aiPanel():view==='export'?exportPanel():tableEditor();
 return `<aside class="panel inspector" aria-label="Pieza elegida e IA"><div class="inspector-tabs"><button data-action="go-editor" aria-pressed="${view!=='ai'}">Pieza</button><button data-action="go-ai" aria-pressed="${view==='ai'}">IA</button></div><div class="panel-heading"><span class="eyebrow">${view==='ai'?'IA de la escena':view==='export'?'Escena actual':'Mesa y sillas'}</span><h2 tabindex="-1" id="inspectorTitle">${view==='ai'?'IA de la escena':view==='export'?'Exportar a Blender':selectedTable().name+' 01'}</h2><small>${view==='export'?'Escena actual · GLB':`1 mesa · ${model.placed} sillas colocadas`}</small></div><div class="panel-body">${content}</div></aside>`;
}
function exportPopover() {
 const state=currentState();
 return `<div class="export-popover" id="exportActions" role="group" aria-label="Descargar archivos de la escena"><div class="row between"><strong>Exportar escena</strong><button data-action="close-export" class="ghost close" aria-label="Cerrar opciones de exportación">Cerrar ${icon('close')}</button></div><button data-action="png" ${blockedExport()?'disabled':''}>${icon('image')} Descargar PNG · 3000 px</button><button data-action="glb" class="primary" ${blockedExport()?'disabled':''}>${icon('file')} ${state==='pending'?'Preparando GLB…':'Descargar modelo GLB · Blender'}</button><p>Escena completa · escala en metros</p>${state==='pending'||state==='partial'||state==='disabled'||state==='empty'?'<p>Espera a que la escena esté lista y completa para iniciar una nueva exportación.</p>':''}<p>En Blender: Archivo → Importar → glTF 2.0.</p><small>Sin descarga real en este mockup.</small></div>`;
}
function topbar() {
 const denied=currentState()==='permission-denied';
 return `<header class="topbar"><div class="brand"><span class="brand-mark">Pictures</span><h1>Taller 3D</h1>${denied?'':`<span class="project-name">Cumpleaños · lavanda</span>`}</div><div class="actions">${denied?'<button data-action="home">Volver</button>':`<div class="history-tools" aria-label="Historial de edición"><button data-action="undo" aria-label="Deshacer" title="Deshacer último cambio simulado" ${history.past.length?'':'disabled'}>${icon('undo')}</button><button data-action="redo" aria-label="Rehacer" title="Rehacer cambio simulado" ${history.future.length?'':'disabled'}>${icon('redo')}</button></div><button data-action="shopping" id="shoppingTrigger">Lista de compra</button><div class="export-wrap"><button data-action="open-export" id="exportTrigger" aria-label="Exportar escena" aria-expanded="${selectors.scene.value==='export'}" aria-controls="exportActions" ${['loading','permission-denied'].includes(currentState())?'disabled':''}>${icon('download')}Exportar</button>${selectors.scene.value==='export'?exportPopover():''}</div>`}</div></header>`;
}
function shoppingContent() {
 const state=currentState();
 const rows=[{qty:1,title:selectedTable().name,desc:`${fmt(model.length)} × ${fmt(model.width)} × ${fmt(model.height)} m`},{qty:model.placed,title:`Silla ${model.chair}`,desc:`${model.distribution} · colocadas en la escena`},{qty:1,title:'Panel redondo',desc:'Backing · diámetro 1,50 m'},{qty:1,title:'Juego de pedestales',desc:'Backing · cilindros escalonados'}];
 return `<div class="dialog-heading"><div><p class="eyebrow">Escena actual</p><h2 id="purchaseTitle">Lista de compra</h2></div><button data-action="close-shopping" aria-label="Cerrar lista de compra">${icon('close')}</button></div><div class="dialog-body"><p class="muted">${state==='permission-denied'?'':'Cumpleaños · lavanda · cantidades colocadas'}</p>${state==='permission-denied'?'<div class="state-box"><h3>Tu cuenta no tiene acceso a esta herramienta</h3><button data-action="home">Volver</button></div>':`${notice('shopping')}${dataState('shopping')||`<section><h3>Mobiliario</h3><div class="list-columns"><span>Pieza / medidas</span><span>Cantidad</span></div><ul class="list-rows">${rows.slice(0,2).map(line=>`<li><div><h4>${line.title}</h4><p class="muted mono">${line.desc}</p></div><span class="quantity" aria-label="${line.qty} unidades">${line.qty}</span></li>`).join('')}</ul></section><section><h3>Escenografía</h3><div class="list-columns"><span>Pieza</span><span>Cantidad</span></div><ul class="list-rows">${rows.slice(2).map(line=>`<li><div><h4>${line.title}</h4><p class="muted mono">${line.desc}</p></div><span class="quantity" aria-label="${line.qty} unidades">${line.qty}</span></li>`).join('')}</ul></section>`}<div class="note">Mobiliario y escenografía no son productos de la tienda. Esta lista no les asigna precios.</div>`}</div><div class="dialog-footer"><button data-action="close-shopping" class="primary">Volver a la escena</button></div>`;
}
function render({focusPanel=false,focusExport=false}={}) {
 const view=currentView(), state=currentState();
 planningContext();
 if(purchaseDialog.open) purchaseDialog.close();
 app.dataset.view=view;
 app.setAttribute('aria-busy',String(['loading','pending'].includes(state)));
 if(state==='permission-denied'){
 selectors.scene.value='none';
 app.innerHTML=topbar()+'<main class="gate"><span class="badge">Acceso restringido</span><h2>Tu cuenta no tiene acceso a esta herramienta</h2><p class="muted">Contacta con un administrador si necesitas este acceso.</p><button class="primary" data-action="home">Volver</button></main>';
 return;
 }
 app.innerHTML=topbar()+`<div class="workbench"><nav class="rail" aria-label="Paneles"><button aria-label="Añadir" aria-pressed="${['tables','backing'].includes(view)}" data-action="go-tables">${icon('plus')}<small>Añadir</small></button><button aria-label="Editar pieza" aria-pressed="${view==='table-editor'}" data-action="go-editor">${icon('piece')}<small>Pieza</small></button><button aria-label="IA de la escena" aria-pressed="${view==='ai'}" data-action="go-ai">${icon('ai')}<small>IA</small></button></nav>${leftPanel()}<main class="viewport" aria-label="Visor 3D esquemático"><div class="scene-meta"><span class="pill">${model.angle} · ejemplo</span><span class="pill">${state==='empty'&&view==='export'?'0 piezas':`${model.placed} sillas colocadas`}</span></div>${sceneArt(state==='empty'&&view==='export')}<div class="scene-footer"><button data-action="go-editor">Editar mesa</button><div class="view-tools" aria-label="Vistas del visor"><button data-action="perspective" aria-pressed="${model.angle==='Perspectiva'}">Perspectiva</button><button data-action="plan" aria-pressed="${model.angle==='Planta'}">Planta</button></div></div><p class="scene-summary">${state==='empty'&&view==='export'?'Escena sin piezas.':`${selectedTable().name}: ${fmt(model.length)} × ${fmt(model.width)} m · ${model.placed} sillas.`} Geometría esquemática.</p></main>${inspector()}</div><nav class="mobile-nav" aria-label="Secciones del Taller"><button data-action="go-tables" aria-pressed="${view==='tables'}">Añadir</button><button data-action="go-backing" aria-pressed="${view==='backing'}">Backing</button><button data-action="go-editor" aria-pressed="${view==='table-editor'}">Pieza</button><button data-action="go-ai" aria-pressed="${view==='ai'}">IA</button></nav>`;
 if(model.notice) app.insertAdjacentHTML('beforeend',`<div class="toast" role="status">${escapeHTML(model.notice)}</div>`);
 if(selectors.scene.value==='shopping'){
 document.getElementById('purchaseContent').innerHTML=shoppingContent();
 purchaseDialog.showModal();
 }
 if(focusPanel) document.getElementById('inspectorTitle')?.focus();
 if(focusExport) document.querySelector('#exportActions button')?.focus();
}
function changeView(view,state='ready') {
 lastInvoker=null;selectors.view.value=view;model.query='';model.notice='';setStates(state);
 selectors.scene.value=view==='export'?'export':view==='shopping'?'shopping':'none';
 render({focusPanel:window.innerWidth<1024&&['table-editor','ai'].includes(view)});
}
function closeOverlay(kind) {
 selectors.scene.value='none';
 render();
 const fallback=document.getElementById(kind==='shopping'?'shoppingTrigger':'exportTrigger');
 (lastInvoker?.isConnected?lastInvoker:fallback)?.focus();
}
function startExport() {
 if(blockedExport()) return;
 selectors.view.value='export';setStates('pending');selectors.scene.value='export';model.notice='';render();announce('Preparando GLB…');
 setTimeout(()=>{
 if(currentView()!=='export'||currentState()!=='pending')return;
 selectors.state.value='success';selectors.scene.value='none';model.notice='Descarga GLB iniciada. Simulación: no se creó un archivo.';render();document.getElementById('exportTrigger')?.focus();announce(model.notice);
 },700);
}
for(const id of ['view','state','scene','theme']) selectors[id].addEventListener('change',()=>{
 model.notice='';
 if(id==='view'){changeView(currentView());return;}
 if(id==='theme')document.documentElement.dataset.theme=selectors.theme.value;
 if(id==='state'&&currentView()==='table-editor'&&currentState()==='partial'&&model.requested<=model.placed){model.requested=12;model.placed=8;}
 if(id==='scene'&&selectors.scene.value!=='none')lastInvoker=document.activeElement;
 render({focusExport:id==='scene'&&selectors.scene.value==='export'});
});
document.addEventListener('click',event=>{
 const target=event.target.closest('button[data-action]');
 if(!target||target.disabled)return;
 const action=target.dataset.action;
 if(action==='undo'||action==='redo'){const source=action==='undo'?history.past:history.future;const dest=action==='undo'?history.future:history.past;if(!source.length)return;dest.push(snapshot());Object.assign(model,source.pop());model.notice=action==='undo'?'Cambio deshecho (simulación).':'Cambio rehecho (simulación).';selectors.state.value='ready';render();announce(model.notice);return;}
 const routes={'go-tables':'tables','go-editor':'table-editor','go-backing':'backing','go-ai':'ai'};
 if(routes[action]){changeView(routes[action]);return;}
 if(action==='shopping'){lastInvoker=target;selectors.scene.value='shopping';render();return;}
 if(action==='close-shopping'){closeOverlay('shopping');return;}
 if(action==='open-export'){lastInvoker=target;selectors.scene.value=selectors.scene.value==='export'?'none':'export';render({focusExport:selectors.scene.value==='export'});return;}
 if(action==='close-export'){closeOverlay('export');return;}
 if(action==='glb'){startExport();return;}
 if(action==='png'){model.notice='Descarga PNG simulada; no se creó ningún archivo.';selectors.scene.value='none';render();announce(model.notice);return;}
 if(action==='add-table'||action==='add-table-kind'){
 remember();setTable(action==='add-table'?'rectangular':target.dataset.tableType);
 changeView('table-editor','success');model.notice=`${selectedTable().name} añadida con sus medidas iniciales. Sillas de ejemplo; ajusta la mesa en el inspector.`;render({focusPanel:window.innerWidth<1024});announce(model.notice);return;
 }
 if(action==='add-prop'){
 const prop=props.find(item=>item.id===target.dataset.id);if(!prop)return;
 {model.added.push(prop.id);selectors.state.value='success';model.notice=`${prop.name} añadido a la escena (simulación).`;}
 render();announce(model.notice);return;
 }
 if(action==='clear-search'){model.query='';selectors.state.value='ready';render();return;}
 if(action==='retry'){selectors.state.value='loading';render();setTimeout(()=>{if(currentState()==='loading'){selectors.state.value='ready';render();announce('Datos de ejemplo recuperados.');}},350);return;}
 if(action==='reset-dimensions'){selectors.state.value='ready';render();return;}
 if(action==='send-ai'){
 const prompt=document.getElementById('prompt')?.value.trim();
 if(!prompt){selectors.state.value='validation';render();document.getElementById('prompt')?.focus();return;}
 model.prompt=prompt;selectors.state.value='pending';render();setTimeout(()=>{if(currentView()==='ai'&&currentState()==='pending'){selectors.state.value='partial';render();announce('Propuesta de ejemplo preparada.');}},700);return;
 }
 if(action==='apply-ai'){remember();setTable('rectangular');selectors.state.value='success';render();announce('Propuesta de ejemplo aplicada.');return;}
 if(action==='home'){changeView('tables');model.notice='Navegación simulada al inicio; el producto usa tu primera herramienta permitida.';render();return;}
 if(action==='plan'||action==='perspective'){model.angle=action==='plan'?'Planta':'Perspectiva';render();return;}
 if(action==='legacy-fixed'){model.legacy='fixed';render();return;}
 if(action==='convert-legacy'){model.legacy='editable';model.notice='Conjunto convertido a editable (simulación).';render();return;}
});
document.addEventListener('change',event=>{
 const input=event.target;
 if(input.matches('[data-dimension]')){
 const [lengthRange,widthRange,heightRange]=selectedTable().ranges;
 const ranges={length:lengthRange,width:widthRange,height:heightRange};
 const key=input.dataset.dimension,value=Number(input.value.replace(',','.')),[min,max]=ranges[key];
 if(!input.value.trim()||!Number.isFinite(value)||value<min||value>max){
 selectors.state.value='validation';input.setAttribute('aria-invalid','true');const errorId=key+'-error';input.setAttribute('aria-describedby',key+'-help '+errorId);
 let error=document.getElementById(errorId);if(!error){error=document.createElement('span');error.id=errorId;error.className='field-error';input.after(error);}error.textContent=`Introduce un valor entre ${fmt(min)} y ${fmt(max)} m. La escena no cambió.`;error.setAttribute('role','alert');return;
 }
 if(model[key]===value){selectors.state.value='ready';render();announce('Medida válida. La escena conserva sus medidas.');return;}
 remember();model[key]=value;if(key==='length'&&selectedTable().derived)model.width=value*selectedTable().derived;selectors.state.value='success';model.notice=`Mesa actualizada: ${fmt(model.length)} × ${fmt(model.width)} m; ${model.placed} sillas colocadas (ejemplo).`;render();announce(model.notice);
 }else if(input.id==='chair-count'){
 const value=Number(input.value);if(!input.value||!Number.isInteger(value)||value<0||value>40){input.setAttribute('aria-invalid','true');document.getElementById('chair-help').textContent='Introduce un entero entre 0 y 40. La escena conserva el último valor válido.';return;}
 if(model.requested===value){selectors.state.value=value>8?'partial':'ready';render();return;}
 remember();model.requested=value;model.placed=Math.min(8,value);selectors.state.value=value>8?'partial':'success';render();announce(`${model.placed} sillas colocadas; ${value} pedidas. Capacidad de ejemplo.`);
 }else if(input.id==='chair-type'){remember();model.chair=input.value;render();}
 else if(input.id==='chair-layout'){remember();model.distribution=input.value;render();}
 else if(input.id==='cloth'){remember();model.cloth=input.value;render();}
 else if(input.matches('[data-color]')){remember();model[input.dataset.color]=input.value;render();}
 else if(input.id==='search'){model.query=input.value;render();document.getElementById('search')?.focus();}
 else if(input.id==='prompt'){model.prompt=input.value;}
});
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'&&selectors.scene.value==='export'){event.preventDefault();closeOverlay('export');}
});
document.addEventListener('pointerdown',event=>{
 if(selectors.scene.value==='export'&&!event.target.closest('.export-wrap')&&!event.target.closest('.mock-controls')) closeOverlay('export');
});
purchaseDialog.addEventListener('keydown',event=>{
 if(event.key!=='Tab')return;
 const stops=[...purchaseDialog.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex="0"]')].filter(el=>el.checkVisibility());
 const first=stops[0],last=stops[stops.length-1];
 if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}
 else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}
});
purchaseDialog.addEventListener('cancel',event=>{event.preventDefault();closeOverlay('shopping');});
setStates();render();
</script>
</body>
</html>
