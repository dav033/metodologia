 selectors.state.innerHTML=allowedStates[currentView()].map(state=>`<option value="${state}">${stateLabels[state]}</option>`).join('');

}

function notice(view=currentView()) {

 return '';
}

}
function catalogue() {
 return `<main class="catalogue"><div class="catalogue-layout"><details class="filters" open><summary>Filtros del catálogo</summary><div class="stack"><label>Buscar en Backing<input id="search" type="search" value="${escapeHTML(model.query)}" placeholder="Panel, aro…"></label><h3>Categoría</h3><button aria-pressed="true" data-action="go-catalogue">✓ Backing</button><button data-action="old-catalogue">Ver categorías anteriores</button><p class="muted">La categoría agrupa piezas existentes. No cambia sus referencias.</p></div></details><section><div class="catalogue-head"><p class="eyebrow">Catálogo / Backing</p><h2>El fondo de tu celebración</h2><p class="muted">Aros, pedestales, paneles y arcos chiara.</p><span class="question-mark">Propuesta Q3 · grupo «Piezas para la escena», ubicación pendiente de aprobación.</span></div>${notice('catalogue')}${dataState('catalogue')||`<div class="row between" style="margin-bottom:16px"><h3>Piezas para la escena</h3><small>7 ejemplos · datos ficticios</small></div>${propCards(true)}`}<p class="note questions">Las piezas de escenografía no son productos de la tienda. Los productos reales conservarán sus precios y disponibilidad de catálogo.</p></section></div></main>`;
}
function shoppingContent() {
 const state=currentState();
 const rows=[{qty:1,title:'Mesa rectangular',desc:`${fmt(model.length)} × ${fmt(model.width)} × ${fmt(model.height)} m`},{qty:model.placed,title:`Silla ${model.chair}`,desc:`${model.distribution} · colocadas en la escena`},{qty:1,title:'Panel redondo',desc:'Backing · diámetro 1,50 m'},{qty:1,title:'Juego de pedestales',desc:'Backing · cilindros escalonados'}];
 return `<div class="dialog-heading"><div><p class="eyebrow">Escena actual</p><h2 id="purchaseTitle">Lista de compra</h2></div><button data-action="close-shopping" aria-label="Cerrar lista de compra">×</button></div><div class="dialog-body"><p class="muted">${state==='permission-denied'?'':'Cumpleaños · lavanda · cantidades colocadas'}</p>${state==='permission-denied'?'<div class="state-box"><h3>Tu cuenta no tiene acceso a esta herramienta</h3><button data-action="home">Volver</button></div>':`${notice('shopping')}${dataState('shopping')||`<section><h3>Mobiliario</h3><ul class="list-rows">${rows.slice(0,2).map(line=>`<li><span class="quantity">${line.qty}×</span><div><h4>${line.title}</h4><p class="muted">${line.desc}</p></div></li>`).join('')}</ul></section><section><h3>Escenografía</h3><ul class="list-rows">${rows.slice(2).map(line=>`<li><span class="quantity">${line.qty}×</span><div><h4>${line.title}</h4><p class="muted">${line.desc}</p></div></li>`).join('')}</ul></section>`}<div class="note">Mobiliario y escenografía no son productos de la tienda. Esta lista no les asigna precios.</div>`}</div><div class="dialog-footer"><button data-action="close-shopping" class="primary">Volver a la escena</button></div>`;
}
function render({focusPanel=false,focusExport=false}={}) {
 const view=currentView(), state=currentState();
 if(purchaseDialog.open) purchaseDialog.close();
 app.dataset.view=view;
 if(state==='permission-denied'){
 selectors.scene.value='none';
 app.innerHTML=topbar(view==='catalogue')+'<main class="gate"><span class="badge">Acceso restringido</span><h2>Tu cuenta no tiene acceso a esta herramienta</h2><p class="muted">Contacta con un administrador si necesitas este acceso.</p><button class="primary" data-action="home">Volver</button></main>';
 return;
 }
 if(view==='catalogue') app.innerHTML=topbar(true)+catalogue();
 else app.innerHTML=topbar()+`<div class="workbench"><nav class="rail" aria-label="Paneles"><button aria-label="Añadir" aria-pressed="${['tables','backing'].includes(view)}" data-action="go-tables">＋<small>Añadir</small></button><button aria-label="Editar pieza" aria-pressed="${view==='table-editor'}" data-action="go-editor">◇<small>Pieza</small></button><button aria-label="IA de la escena" aria-pressed="${view==='ai'}" data-action="go-ai">✧<small>IA</small></button><div class="spacer"></div><button aria-label="Catálogo" data-action="go-catalogue">▦<small>Catálogo</small></button></nav>${leftPanel()}<main class="viewport" aria-label="Visor 3D esquemático"><div class="scene-meta"><span class="pill">${model.angle} · ejemplo</span><span class="pill">${state==='empty'&&view==='export'?'0 piezas':`${model.placed} sillas colocadas`}</span></div>${sceneArt(state==='empty'&&view==='export')}<div class="scene-footer"><button data-action="go-editor">Editar mesa</button><div class="view-tools" aria-label="Vistas del visor"><button data-action="perspective" aria-pressed="${model.angle==='Perspectiva'}">Perspectiva</button><button data-action="plan" aria-pressed="${model.angle==='Planta'}">Planta</button></div></div><p class="scene-summary">${state==='empty'&&view==='export'?'Escena sin piezas.':`Mesa: ${fmt(model.length)} × ${fmt(model.width)} m · ${model.placed} sillas.`} Geometría esquemática.</p></main>${inspector()}</div><nav class="mobile-nav" aria-label="Secciones del Taller"><button data-action="go-tables" aria-pressed="${view==='tables'}">Añadir</button><button data-action="go-backing" aria-pressed="${view==='backing'}">Backing</button><button data-action="go-editor" aria-pressed="${view==='table-editor'}">Pieza</button><button data-action="go-ai" aria-pressed="${view==='ai'}">IA</button></nav>`;
 if(model.notice) app.insertAdjacentHTML('beforeend',`<div class="toast" role="status">${escapeHTML(model.notice)}</div>`);
 if(selectors.scene.value==='shopping'){
 document.getElementById('purchaseContent').innerHTML=shoppingContent();
 purchaseDialog.showModal();
 }
 if(focusPanel) document.getElementById('inspectorTitle')?.focus();
 if(focusExport) document.querySelector('#exportActions button')?.focus();
}
function changeView(view,state='ready') {
 selectors.view.value=view;model.query='';model.notice='';setStates(state);
 selectors.scene.value=view==='export'?'export':view==='shopping'?'shopping':'none';
 render({focusPanel:window.innerWidth<1024&&['table-editor','ai'].includes(view)});
}
function closeOverlay(kind) {
 selectors.scene.value='none';
 render();
 const fallback=document.getElementById(kind==='shopping'?'shoppingTrigger':'exportTrigger');
 (lastInvoker?.isConnected?lastInvoker:fallback)?.focus();
}
function startExport() {
 if(blockedExport()) return;
 selectors.view.value='export';setStates('pending');selectors.scene.value='export';model.notice='';render();announce('Preparando GLB…');
 setTimeout(()=>{
 if(currentView()!=='export'||currentState()!=='pending')return;
 selectors.state.value='success';selectors.scene.value='none';model.notice='Descarga GLB iniciada. Simulación: no se creó un archivo.';render();document.getElementById('exportTrigger')?.focus();announce(model.notice);
 },700);
}
for(const id of ['view','state','scene','theme']) selectors[id].addEventListener('change',()=>{
 model.notice='';
 if(id==='view'){changeView(currentView());return;}
 if(id==='theme')document.documentElement.dataset.theme=selectors.theme.value;
 if(id==='scene'&&selectors.scene.value!=='none')lastInvoker=document.activeElement;
 render({focusExport:id==='scene'&&selectors.scene.value==='export'});
});
document.addEventListener('click',event=>{
 const target=event.target.closest('button[data-action]');
 if(!target||target.disabled)return;
 const action=target.dataset.action;
 if(action==='undo'||action==='redo'){const source=action==='undo'?history.past:history.future;const dest=action==='undo'?history.future:history.past;if(!source.length)return;dest.push(snapshot());Object.assign(model,source.pop());model.notice=action==='undo'?'Cambio deshecho (simulación).':'Cambio rehecho (simulación).';selectors.state.value='ready';render();announce(model.notice);return;}
 const routes={'go-tables':'tables','go-editor':'table-editor','go-backing':'backing','go-catalogue':'catalogue','go-ai':'ai'};
 if(routes[action]){changeView(routes[action]);return;}
 if(action==='shopping'){lastInvoker=target;selectors.scene.value='shopping';render();return;}
 if(action==='close-shopping'){closeOverlay('shopping');return;}
 if(action==='open-export'){lastInvoker=target;selectors.scene.value=selectors.scene.value==='export'?'none':'export';render({focusExport:selectors.scene.value==='export'});return;}
 if(action==='close-export'){closeOverlay('export');return;}
 if(action==='glb'){startExport();return;}
 if(action==='png'){model.notice='Descarga PNG simulada; no se creó ningún archivo.';selectors.scene.value='none';render();announce(model.notice);return;}
 if(action==='existing-table'){model.notice=`${target.dataset.name}: acceso al editor existente representado en este mockup. El flujo detallado aquí es la mesa rectangular.`;render();announce(model.notice);return;}
 if(action==='add-table'||action==='generic-table'){
 model.showTable=true;model.notice='Mesa rectangular añadida. 8 sillas colocadas (ejemplo).';
 if(action==='add-table'){model.length=2.4;model.width=.9;model.height=.75;model.placed=8;model.requested=8;}
 changeView('table-editor','success');announce('Mesa rectangular seleccionada.');return;
 }
 if(action==='add-prop'||action==='open-prop'){
 const prop=props.find(item=>item.id===target.dataset.id);if(!prop)return;
 if(action==='open-prop'){changeView('backing','success');model.notice=`${prop.name}: disponible en la escena actual (simulación).`;}
 else{model.added.push(prop.id);selectors.state.value='success';model.notice=`${prop.name} añadido a la escena (simulación).`;}
 render();announce(model.notice);return;
 }
 if(action==='clear-search'){model.query='';selectors.state.value='ready';render();return;}
 if(action==='retry'){selectors.state.value='loading';render();setTimeout(()=>{if(currentState()==='loading'){selectors.state.value='ready';render();announce('Datos de ejemplo recuperados.');}},350);return;}
 if(action==='reset-dimensions'){selectors.state.value='ready';render();return;}
 if(action==='send-ai'){
 const prompt=document.getElementById('prompt')?.value.trim();
 if(!prompt){selectors.state.value='validation';render();document.getElementById('prompt')?.focus();return;}
 model.prompt=prompt;selectors.state.value='pending';render();setTimeout(()=>{if(currentView()==='ai'&&currentState()==='pending'){selectors.state.value='partial';render();announce('Propuesta de ejemplo preparada.');}},700);return;
 }
 if(action==='apply-ai'){model.placed=8;model.requested=8;model.showTable=true;selectors.state.value='success';render();announce('Propuesta de ejemplo aplicada.');return;}
 if(action==='old-category'||action==='old-catalogue'){changeView('backing');model.notice='Ruta anterior conservada: Fondos y muebles / Escenografía. Mismos siete ejemplos e identidades.';render();return;}
 if(action==='home'){changeView('tables');model.notice='Navegación simulada al inicio; el producto usa tu primera herramienta permitida.';render();return;}
 if(action==='plan'||action==='perspective'){model.angle=action==='plan'?'Planta':'Perspectiva';render();return;}
 if(action==='legacy-fixed'){model.legacy='fixed';render();return;}
 if(action==='convert-legacy'){model.legacy='editable';model.notice='Conjunto convertido a editable (simulación).';render();return;}
});
document.addEventListener('change',event=>{
 const input=event.target;
 if(input.matches('[data-dimension]')){
 const ranges={length:[1,6],width:[.4,1.5],height:[.4,1.1]};
 const key=input.dataset.dimension,value=Number(input.value.replace(',','.')),[min,max]=ranges[key];
 if(!input.value.trim()||!Number.isFinite(value)||value<min||value>max){
 selectors.state.value='validation';input.setAttribute('aria-invalid','true');const errorId=key+'-error';input.setAttribute('aria-describedby',key+'-help '+errorId);
 let error=document.getElementById(errorId);if(!error){error=document.createElement('span');error.id=errorId;error.className='field-error';input.after(error);}error.textContent=`Introduce un valor entre ${fmt(min)} y ${fmt(max)} m. La escena no cambió.`;error.setAttribute('role','alert');return;
 }
 remember();model[key]=value;selectors.state.value='success';model.notice=`Mesa actualizada: ${fmt(model.length)} × ${fmt(model.width)} m; ${model.placed} sillas colocadas (ejemplo).`;render();announce(model.notice);
 }else if(input.id==='chair-count'){
 const value=Number(input.value);if(!input.value||!Number.isInteger(value)||value<0||value>40){input.setAttribute('aria-invalid','true');document.getElementById('chair-help').textContent='Introduce un entero entre 0 y 40. La escena conserva el último valor válido.';return;}
 remember();model.requested=value;model.placed=Math.min(8,value);selectors.state.value=value>8?'partial':'success';render();announce(`${model.placed} sillas colocadas; ${value} pedidas. Capacidad de ejemplo.`);
 }else if(input.id==='chair-type'){remember();model.chair=input.value;render();}
 else if(input.id==='chair-layout'){remember();model.distribution=input.value;render();}
 else if(input.id==='cloth'){remember();model.cloth=input.value;render();}
 else if(input.matches('[data-color]')){remember();model[input.dataset.color]=input.value;render();}
 else if(input.id==='search'){model.query=input.value;render();document.getElementById('search')?.focus();}
 else if(input.id==='prompt'){model.prompt=input.value;}
});
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'&&selectors.scene.value==='export'){event.preventDefault();closeOverlay('export');}
});
document.addEventListener('pointerdown',event=>{
 if(selectors.scene.value==='export'&&!event.target.closest('.export-wrap')&&!event.target.closest('.mock-controls')) closeOverlay('export');
});
purchaseDialog.addEventListener('cancel',event=>{event.preventDefault();closeOverlay('shopping');});
setStates();render();
</script>
</body>
</html>
