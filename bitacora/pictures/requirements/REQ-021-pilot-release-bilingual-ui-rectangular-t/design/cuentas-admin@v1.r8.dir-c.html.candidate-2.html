<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup · Candidato 2 · Caja de herramientas</title>
<style>
:root{--case:#e04f1c;--foam:#2b2b31;--slot:#18181c;--paper:#fff7f0;--ink:#1d1410;--soft:#5d4a40;--edge:#8a6d5e;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--case:#7d2a0e;--foam:#1c1c21;--slot:#0d0d10;--paper:#2a1d17;--ink:#fff3ea;--soft:#e4c8b8;--edge:#c09a86;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;color:var(--ink);background:var(--paper)}
.tag{position:fixed;top:8px;left:8px;background:#11111b;color:#cdd6f4;font:600 11px system-ui;padding:3px 8px;border-radius:4px}
main{padding:56px 32px;max-width:1040px;margin:auto}
h1{font:900 clamp(40px,6vw,76px)/.95 Georgia,serif;margin:0 0 24px}
.case{background:var(--case);border-radius:30px;padding:22px;box-shadow:inset 0 -10px 0 #0003}
.handle{width:160px;height:26px;border:8px solid var(--case);border-bottom:0;border-radius:20px 20px 0 0;margin:0 auto -2px}
.foam{background:var(--foam);border-radius:18px;padding:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cut{background:var(--slot);border-radius:40px 40px 18px 18px;min-height:120px;padding:16px;color:#f4efe9;display:flex;flex-direction:column;justify-content:end}
.cut b{font:800 19px Georgia,serif}.cut small{color:#d8cfc8}
.cut.on{outline:3px solid #ffd166;outline-offset:-6px}
@media(max-width:700px){main{padding:40px 20px}.foam{grid-template-columns:1fr}}
</style>
<span class="tag">Mockup · candidato 2</span>
<main><h1>Herramientas por persona.</h1><div class="handle" aria-hidden="true"></div><section class="case"><div class="foam">
<div class="cut on"><b>Ana Ríos</b><small>Plan 2 · Activa</small></div><div class="cut"><b>Camila Mesa</b><small>Plan 3 · Invitada</small></div><div class="cut"><b>Lucía Vélez</b><small>Montaje · Desactivada</small></div></div></section></main>
