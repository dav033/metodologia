<!doctype html><html lang="es" data-theme="light"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mockup · Banco de inflado · C2</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3ea;color:#1f2a24;font:15px system-ui}
.tag{position:fixed;right:12px;top:12px;background:#1f2a24;color:#fff;padding:6px 10px;border-radius:10px;font-size:12px}
main{max-width:1180px;margin:auto;padding:28px;display:grid;grid-template-rows:auto 1fr auto;gap:18px;min-height:100vh}
h1{font:900 clamp(30px,4vw,52px)/1.05 "Rounded Mplus 1c",sans-serif;margin:0;letter-spacing:-1.5px}
.stage{position:relative;border-radius:999px 999px 40px 40px;background:radial-gradient(circle at 50% 120%,#fff 0 30%,#cfe3d4 31%);border:3px solid #3e5a49;min-height:330px;display:grid;place-items:center;overflow:hidden}
.table{width:46%;height:90px;background:#ffd34d;border:3px solid #6a5310;border-radius:22px;position:relative;animation:inflate 900ms cubic-bezier(.2,1.6,.4,1) both}
.table i{position:absolute;width:30px;height:34px;border-radius:12px;background:#ff7a9a;border:2px solid #7c1f37}
.gauge{position:absolute;right:28px;top:28px;width:110px;height:110px;border-radius:50%;border:6px solid #3e5a49;background:#fff;display:grid;place-items:center;font:800 28px system-ui}
.gauge small{display:block;font-size:11px;font-weight:400;text-align:center}
.drawer{background:#3e5a49;color:#fff;border-radius:28px 28px 12px 12px;padding:18px 20px 22px}
.drawer nav{display:flex;gap:8px;margin:-38px 0 14px}
.drawer nav b{background:#3e5a49;padding:10px 18px;border-radius:16px 16px 0 0;font-weight:600}
.drawer nav b.on{background:#ffd34d;color:#1f2a24}
.tray{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}
.pillow{height:86px;border-radius:26px;background:#f3f7f1;color:#1f2a24;display:grid;place-items:center;font-size:12px;font-weight:600;box-shadow:inset 0 -6px 0 #b9cdbd;transition:transform 160ms cubic-bezier(.2,1.6,.4,1)}
.pillow:hover{transform:translateY(-6px) scale(1.04,.96)}
@keyframes inflate{from{transform:scale(.6,.3)}to{transform:none}}
@media(max-width:760px){main{padding:20px}.tray{grid-template-columns:repeat(4,1fr)}.gauge{width:84px;height:84px;font-size:22px}.stage{min-height:240px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><body><span class="tag">Mockup · candidato C2</span><main>
<h1>Banco de inflado</h1>
<div class="stage"><div class="table">
<i style="left:12%;top:-42px"></i><i style="left:42%;top:-42px"></i><i style="left:72%;top:-42px"></i>
<i style="left:12%;bottom:-42px"></i><i style="left:42%;bottom:-42px"></i><i style="left:72%;bottom:-42px"></i></div>
<div class="gauge"><div>6/8<small>sillas caben</small></div></div></div>
<section class="drawer"><nav><b class="on">Mesas</b><b>Backing</b><b>Lista</b><b>Exportar</b></nav>
<div class="tray"><span class="pillow">Rectangular</span><span class="pillow">Redonda</span><span class="pillow">Cuadrada</span><span class="pillow">Ovalada</span><span class="pillow">Cóctel</span><span class="pillow">Media luna</span><span class="pillow">Serpentina</span><span class="pillow">En U</span></div></section>
</main></body></html>
